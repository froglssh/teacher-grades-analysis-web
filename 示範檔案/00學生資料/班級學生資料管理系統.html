<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>班級學生資料管理系統｜導師德性評語參考</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
<style>
:root{
  --bg:#f4f6fb; --panel:#ffffff; --ink:#1f2937; --muted:#6b7280; --line:#e3e8f0;
  --brand:#2f5fa6; --brand-d:#244c86; --accent:#0e9488; --warn:#c2410c; --danger:#b91c1c;
  --pos:#0e7490; --neg:#9a3412; --chip:#eef3fb; --shadow:0 1px 3px rgba(20,40,80,.08),0 6px 24px rgba(20,40,80,.06);
}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:13px}
.app{display:flex;min-height:100vh}
/* ---- Sidebar ---- */
.side{width:262px;background:linear-gradient(180deg,#26375a,#1d2c49);color:#dce4f2;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0}
.side h1{font-size:16px;margin:0;padding:18px 18px 4px;letter-spacing:.5px}
.side .sub{font-size:11.5px;color:#9fb0cf;padding:0 18px 12px;border-bottom:1px solid rgba(255,255,255,.08)}
.backup-launch-wrap{padding:12px 12px 4px}
.backup-launch{width:100%;display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;border:1px solid #fbbf24;border-radius:10px;background:linear-gradient(135deg,#fff4cc,#fcd979);color:#3d3215;box-shadow:0 3px 10px rgba(0,0,0,.2)}
.backup-launch:hover{filter:brightness(1.04);transform:translateY(-1px)}
.backup-launch .backup-icon{font-size:23px;line-height:1}
.backup-launch .backup-copy{display:flex;flex-direction:column;line-height:1.35}
.backup-launch .backup-copy strong{font-size:13px}
.backup-launch .backup-copy small{font-size:10.5px;color:#66551f;margin-top:2px}
.backup-launch .backup-arrow{margin-left:auto;font-size:22px;font-weight:700;color:#8a6a12}
.classbox{padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.08);font-size:12px}
.classbox label{display:block;color:#9fb0cf;margin:6px 0 2px}
.classbox input{width:100%;padding:6px 8px;border-radius:6px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:#fff}
.roster{flex:1;overflow-y:auto;padding:8px}
.roster .rtitle{display:flex;justify-content:space-between;align-items:center;color:#9fb0cf;font-size:11.5px;padding:6px 8px}
.stu{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;color:#e8edf7;margin-bottom:2px;border:1px solid transparent}
.stu:hover{background:rgba(255,255,255,.07)}
.stu.active{background:#3a72c4;border-color:#5b8fd9}
.stu .no{font-variant-numeric:tabular-nums;font-weight:700;background:rgba(255,255,255,.14);border-radius:5px;padding:1px 6px;font-size:12px;min-width:26px;text-align:center}
.stu .nm{flex:1;font-size:13.5px}
.stu .pct{font-size:10.5px;color:#bcd0f0}
.stu .pct.g{color:#6ee7a8}.stu .pct.y{color:#ffd98a}.stu .pct.r{color:#ff9a9a}
.searchbox{padding:8px 12px 4px}
.searchbox input{width:100%;padding:6px 9px;border-radius:7px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:#fff;font-size:12.5px}
.searchbox input::placeholder{color:#9fb0cf}
.savestat{font-size:11px;color:var(--muted);font-weight:500;margin-left:4px}
.print-only{display:none}
.side .foot{padding:10px 12px;border-top:1px solid rgba(255,255,255,.08);display:flex;flex-wrap:wrap;gap:6px}
.side .foot button{flex:1;min-width:0;font-size:11.5px;padding:7px 4px;border:none;border-radius:7px;background:rgba(255,255,255,.1);color:#e8edf7}
.side .foot button:hover{background:rgba(255,255,255,.2)}
/* ---- Main ---- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:20}
.topbar .title{font-weight:700;font-size:15px;margin-right:auto;display:flex;align-items:center;gap:10px}
.topbar .title .badge{font-size:11px;font-weight:600;color:#fff;background:var(--accent);border-radius:20px;padding:2px 9px}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 12px;border-radius:8px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:5px}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-d);color:#fff}
.btn.gr{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.gr:hover{filter:brightness(.93)}
.btn.db-save{background:#0e9488;border-color:#0e9488;color:#fff;box-shadow:0 2px 7px rgba(14,148,136,.24)}
.btn.db-save:hover{background:#0b7c73;border-color:#0b7c73;color:#fff;transform:translateY(-1px)}
.btn.sm{padding:4px 9px;font-size:11.5px}
.btn.ghost{background:transparent;border-style:dashed;color:var(--muted)}
.content{padding:20px;max-width:1180px;width:100%;margin:0 auto}
/* empty */
.empty{text-align:center;padding:70px 20px;color:var(--muted)}
.empty .big{font-size:46px;margin-bottom:10px}
.empty h2{color:var(--ink);margin:.2em 0}
.empty .cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
/* student header */
.shead{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px;box-shadow:var(--shadow);margin-bottom:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.shead .avatar{width:46px;height:46px;border-radius:12px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700}
.shead .nmeta{display:flex;flex-direction:column}
.shead .nmeta .nm{font-size:19px;font-weight:700}
.shead .nmeta .sub{font-size:12px;color:var(--muted)}
.shead .sp{flex:1}
.shead .semsel{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.shead select{padding:6px 8px;border-radius:7px;border:1px solid var(--line)}
/* card / section */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.card>h3{margin:0;padding:11px 16px;font-size:14px;background:linear-gradient(90deg,#eef3fb,#f7faff);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.card>h3 .ic{color:var(--brand)}
.card>h3 .sp{flex:1}
.card .body{padding:14px 16px}
/* 摺疊 */
.htitle{cursor:pointer;display:inline-flex;align-items:center;gap:8px;user-select:none}
.htitle:hover{color:var(--brand)}
.caret{font-size:11px;color:var(--muted);transition:transform .15s;display:inline-block}
.card:not(.collapsed) .caret,.selfsem:not(.collapsed) .caret{transform:rotate(90deg)}
.card.collapsed .body{display:none}
.selfsem .semtag{cursor:pointer;user-select:none}
.selfsem.collapsed .selfbody{display:none}
.selfsem.collapsed{padding-bottom:10px}
/* field grid */
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px 14px}
.fld{display:flex;flex-direction:column;gap:3px}
.fld label{font-size:11.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:4px}
.fld input,.fld textarea{border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%;background:#fcfdff}
.fld input:focus,.fld textarea:focus,.grid textarea:focus{outline:2px solid #bcd2f3;border-color:var(--brand)}
.fld textarea{resize:vertical;min-height:38px}
.self2{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
@media(max-width:680px){.self2{grid-template-columns:1fr}}
.selfsem{border:1px solid var(--line);border-radius:10px;padding:10px 12px 12px;margin-bottom:12px;background:#fbfcfe}
.selfsem .semtag{display:inline-block;font-weight:700;font-size:12px;color:#fff;background:var(--brand);border-radius:6px;padding:2px 10px;margin-bottom:8px}
table.grid.fixed{table-layout:fixed}
.delfield{color:var(--danger);cursor:pointer;font-size:11px;opacity:.5;margin-left:auto}
.delfield:hover{opacity:1}
/* grid table */
.gridwrap{overflow-x:auto}
table.grid{border-collapse:collapse;width:100%;min-width:560px}
table.grid th,table.grid td{border:1px solid var(--line);padding:0;vertical-align:top}
table.grid th{background:#f3f6fc;font-size:12px;font-weight:700;padding:7px 8px;position:relative;white-space:nowrap}
table.grid td.semcell{background:#fafcff;font-weight:700;font-size:12px;text-align:center;color:var(--brand);white-space:nowrap;padding:6px 8px;width:62px}
table.grid td.semcell.hi{background:#fff3e0;color:var(--warn)}
table.grid textarea{width:100%;border:none;background:transparent;padding:6px 7px;resize:vertical;min-height:34px;display:block}
.dutysel{width:100%;border:none;border-bottom:1px dashed var(--line);background:#f3f8ff;color:var(--brand);font-size:11px;padding:3px 5px;cursor:pointer;display:block}
.dutysel:hover{background:#e7f0ff}
.colmenu{position:absolute;top:3px;right:3px;cursor:pointer;color:var(--muted);font-size:11px;opacity:.45}
.colmenu:hover{opacity:1;color:var(--danger)}
.rowdel{cursor:pointer;color:var(--danger);opacity:.4;font-size:11px}
.rowdel:hover{opacity:1}
.addrow{padding:6px}
/* trait picker for teacher comment */
.tcwrap{display:grid;grid-template-columns:1fr;gap:10px}
.tcrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.picker{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 0;border-top:1px dashed var(--line)}
.picker .grp{display:flex;align-items:center;gap:4px}
.picker select{padding:5px 7px;border-radius:6px;border:1px solid var(--line);max-width:150px}
.picker select.pos{border-color:#7dd3c8}
.picker select.neg{border-color:#e7b39a}
.hint{font-size:11px;color:var(--muted)}
/* 評語草稿暫存區 */
.draftblk{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px;background:#fbfdff}
.drafthd{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.drafthd b{font-size:13px;margin-right:auto;color:var(--brand)}
.draftta{width:100%;min-height:88px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical;background:#fff;font-size:13px;line-height:1.75}
.draftta:focus{outline:2px solid #bcd2f3;border-color:var(--brand)}
.draftft{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:11.5px;color:var(--muted)}
.draftft select,.promptcustom{padding:4px 6px;border:1px solid var(--line);border-radius:6px;font-size:11.5px;max-width:220px}
.promptcustom{min-width:170px}
.aibtn{background:#eef3fb;border:1px solid #cfe0f5;color:#244c86}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(20,30,55,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:#fff;border-radius:14px;max-width:760px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h3{margin:0;padding:15px 20px;border-bottom:1px solid var(--line);font-size:16px;display:flex;align-items:center}
.modal h3 .x{margin-left:auto;cursor:pointer;color:var(--muted);font-size:20px;line-height:1}
.modal .mbody{padding:18px 20px}
.modal .mfoot{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:#fafbfe;position:sticky;bottom:0}
.modal table{border-collapse:collapse;width:100%;font-size:12.5px}
.modal table th,.modal table td{border:1px solid var(--line);padding:6px 8px;text-align:left}
.modal table th{background:#f3f6fc}
.modal select,.modal input[type=text]{padding:5px 7px;border:1px solid var(--line);border-radius:6px;width:100%}
.steps{font-size:13px;color:var(--muted);margin-bottom:12px}
.filedrop{border:2px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--muted);background:#fafcff;cursor:pointer}
.filedrop:hover{border-color:var(--brand);color:var(--brand)}
.chiplist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--chip);border:1px solid #d6e2f4;border-radius:20px;padding:3px 10px;font-size:11.5px}
.backup-card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0;background:#fff}
.backup-card h4{margin:0 0 4px;font-size:14px;color:var(--brand)}
.backup-meta{font-size:11.5px;color:var(--muted);line-height:1.7}
.backup-students{margin:8px 0 0;padding:8px 10px;background:#f7f9fc;border-radius:7px;font-size:12px;max-height:112px;overflow:auto;line-height:1.8}
.backup-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.note{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:8px;padding:9px 12px;font-size:12px;margin:10px 0}
.ok{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;border-radius:8px;padding:9px 12px;font-size:12px;margin:10px 0}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:10px 18px;border-radius:24px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:200;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1;bottom:30px}
.toast.warn{background:#9a3412}.toast.err{background:#b91c1c}
/* 儲存狀態（v3.0） */
.stag{font-size:11.5px;font-weight:600;border-radius:20px;padding:4px 10px;border:1px solid var(--line);background:#f8fafc;color:var(--muted);cursor:pointer;white-space:nowrap;font-family:inherit}
.stag:hover{border-color:var(--brand)}
.stag.ok{background:#ecfdf5;border-color:#a7f3d0;color:#065f46}
.stag.warn{background:#fff7ed;border-color:#fed7aa;color:#9a3412}
.stag.err{background:#fef2f2;border-color:#fecaca;color:#b91c1c}
.topbanner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fef3c7;border-bottom:1px solid #fcd34d;color:#78350f;padding:9px 20px;font-size:13px}
.hidden{display:none!important}
.dlg-bg{position:fixed;inset:0;background:rgba(20,30,55,.55);display:flex;align-items:center;justify-content:center;z-index:150;padding:20px}
.dlg-bg .modal{max-width:560px}
.dlg-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.store-sec{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px;background:#fff}
.store-sec h4{margin:0 0 8px;font-size:14px;color:var(--brand);display:flex;align-items:center;gap:8px}
.store-sec h4 .hint{font-weight:400;margin-left:auto}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 16px;font-size:12.5px;line-height:1.8}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn.danger{color:var(--danger);border-color:#fecaca}
.btn.danger-solid{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.danger-solid:hover{filter:brightness(.92);color:#fff}
.snaptbl td,.snaptbl th{font-size:12px}
/* v3.0 第 2 階段：選單、編輯欄位模式、復原列、抽屜 */
.dd{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(20,40,80,.18);padding:6px;min-width:230px;z-index:40;display:none}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;border:none;background:none;padding:8px 10px;border-radius:7px;font-size:13px;color:var(--ink)}
.menu button:hover,.menu button:focus{background:var(--chip);outline:none}
.menu hr{border:none;border-top:1px solid var(--line);margin:4px 0}
.menu .mh{font-size:11px;color:var(--muted);padding:4px 10px 2px}
body:not(.editing) .edit-only{display:none!important}
.editbar{background:#eef6ff;border:1px dashed #93b4e0;color:#244c86;border-radius:10px;padding:9px 14px;font-size:12.5px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
body.editing .card>h3{background:linear-gradient(90deg,#e7f0ff,#f7faff)}
.undobar{position:fixed;left:50%;bottom:76px;transform:translateX(-50%) translateY(20px);background:#1f2937;color:#fff;border-radius:12px;padding:8px 10px 8px 16px;display:flex;gap:12px;align-items:center;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:210;opacity:0;pointer-events:none;transition:.2s}
.undobar.show{opacity:1;pointer-events:auto;transform:translateX(-50%)}
.undobar .btn{background:#fff;color:var(--ink)}
.shead .ginfo{font-size:12px;color:var(--muted)}
.shead .curtag{font-size:11px;background:#fff3e0;color:var(--warn);border:1px solid #fed7aa;border-radius:20px;padding:1px 8px;margin-left:4px}
.menu-btn{display:none!important}
#drawerMask{display:none}
.classbox select{width:100%;padding:6px 8px;border-radius:6px;border:1px solid rgba(255,255,255,.15);background:#2c3e63;color:#fff;font-size:12px}
@media(max-width:860px){
  .side{position:fixed;left:0;top:0;z-index:60;transform:translateX(-100%);transition:transform .2s;box-shadow:4px 0 24px rgba(0,0,0,.3)}
  .app.drawer-open .side{transform:none}
  .app.drawer-open #drawerMask{display:block;position:fixed;inset:0;background:rgba(20,30,55,.45);z-index:55}
  .menu-btn{display:inline-flex!important}
  .topbar{padding:8px 12px}
  .topbar{position:static}
  .topbar .title{flex-wrap:wrap;font-size:14px}
  .content{padding:12px}
  .shead{padding:12px}
  .shead .sp{display:none}
  .shead .semsel{flex-basis:100%;flex-wrap:wrap;row-gap:6px}
  .btn{white-space:nowrap}
  .card .body{padding:12px 10px}
}
@media print{.undobar,.editbar,.dd,.viewtabs,.ovctl,.ovhint{display:none!important}.ovwrap{max-height:none;overflow:visible;box-shadow:none;border:none}table.ovtbl th{position:static}table.ovtbl td.ovno,table.ovtbl td.ovnm,table.ovtbl th.ovno,table.ovtbl th.ovnm{position:static}}
/* v3.0 第 3 階段：全班總覽、篩選、詞庫搜尋、匯入精靈 */
.viewtabs{display:flex;gap:6px;margin-bottom:12px}
.viewtabs button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 14px;font-size:13px;font-weight:600;color:var(--muted)}
.viewtabs button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.ovctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:12px;box-shadow:var(--shadow);font-size:12.5px}
.ovctl select{padding:6px 8px;border-radius:7px;border:1px solid var(--line);font-size:13px}
.ovctl .sp{flex:1}
.ovwrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:auto;max-height:calc(100vh - 230px)}
table.ovtbl{min-width:0}
table.ovtbl th{position:sticky;top:0;z-index:2;white-space:normal;min-width:96px;vertical-align:bottom}
table.ovtbl th.wide{min-width:240px}
table.ovtbl th small{display:block;font-weight:500;color:var(--muted);font-size:10.5px}
table.ovtbl th small.full{color:#047857}
table.ovtbl td.ovno,table.ovtbl th.ovno{width:46px;min-width:46px;text-align:center;font-weight:700;color:var(--brand);background:#fafcff;padding:6px 4px;position:sticky;left:0;z-index:1}
table.ovtbl td.ovnm,table.ovtbl th.ovnm{min-width:84px;width:84px;padding:6px 8px;white-space:nowrap;background:#fafcff;position:sticky;left:46px;z-index:1}
table.ovtbl th.ovno,table.ovtbl th.ovnm{z-index:3;background:#f3f6fc}
table.ovtbl td.ovnm a{color:var(--ink);text-decoration:none;font-weight:600}
table.ovtbl td.ovnm a:hover{color:var(--brand);text-decoration:underline}
table.ovtbl textarea{field-sizing:content;min-height:32px;max-height:180px;resize:none}
table.ovtbl textarea:focus{background:#fffbea;outline:2px solid #bcd2f3}
table.ovtbl tr.emptyrow td.ovnm{color:var(--warn)}
.searchbox select{width:100%;margin-top:6px;padding:5px 8px;border-radius:7px;border:1px solid rgba(255,255,255,.15);background:#2c3e63;color:#fff;font-size:12px}

const BASIC_FIELD_ORDER=['手機','住址','生日','畢業學校','備註','父姓名','父手機','住家電話','母姓名','母手機'];

  const inPref=BASIC_FIELD_ORDER.filter(f=>cur.includes(f));
  const extras=cur.filter(f=>!BASIC_FIELD_ORDER.includes(f));
  s.schema.basic.fields=[...inPref,...extras];
}
/* 重新套用內建區塊的版面旗標（不動使用者自訂的欄/列） */
function normalizeSchema(s){
  for(const k of Object.keys(DEFAULT_SCHEMA)){
    const d=DEFAULT_SCHEMA[k]; if(!s.schema[k])continue;
    for(const flag of ['fixed','narrow','narrowW','noSemFilter']){
      if(d[flag]!==undefined)s.schema[k][flag]=structuredClone(d[flag]);
      else delete s.schema[k][flag];
    }
  }
}
function blankState(){
  return {meta:{className:'',teacher:'',curSem:'',updatedAt:null},
          schema:structuredClone(DEFAULT_SCHEMA), customSections:[], students:[], ui:{currentId:null,sem:'全部'}};
}
/* 整理任何來源的資料（舊版 localStorage、IndexedDB、資料夾正本、JSON 備份、還原點）；格式不符回傳 null */
function prepareState(raw){
  if(!raw||typeof raw!=='object'||!Array.isArray(raw.students)||!raw.schema||typeof raw.schema!=='object')return null;
  try{
    const s=JSON.parse(JSON.stringify(raw));
    for(const k of ['rev','savedAt','savedBy','appVersion','app','exportedAt'])delete s[k];
    s.meta=Object.assign({className:'',teacher:'',curSem:'',updatedAt:null},s.meta||{});
    s.schema=Object.assign(structuredClone(DEFAULT_SCHEMA),s.schema);
    normalizeSchema(s);
    s.customSections=(Array.isArray(s.customSections)?s.customSections:[]).filter(c=>c&&c.id);
    for(const cs of s.customSections)if(!s.schema[cs.id])s.schema[cs.id]={cols:['內容'],rows:[...SEMS]};
    s.ui=Object.assign({currentId:null,sem:'全部'},s.ui||{});
    s.students=s.students.filter(st=>st&&typeof st==='object');
    for(const st of s.students){if(!st.id)st.id=uid();st.data=st.data||{};}
    migrateTeacherCols(s); // 德性描述+德性表現 → 文字描述評語
    migrateSelfSem(s);     // 自評由全域改為分學期
    migrateGradeCols(s);   // 成績排名改為班排/類組排
    stripSensitive(s);     // v3.0：去除身分證字號
    reorderBasicFields(s); // 基本資料欄位排序（母欄對齊父欄）
    return s;
  }catch(e){console.warn('資料格式無法整理',e);return null;}
}
/* 身分證字號欄位與內容一律移除（v3.0 起不儲存） */
function stripSensitive(s){
  if(!s.schema||!s.schema.basic)return;
  s.schema.basic.fields=(s.schema.basic.fields||[]).filter(f=>!SENSITIVE_RE.test(f));
  for(const st of (s.students||[])){const b=st.data&&st.data.basic;if(b)for(const k of Object.keys(b))if(SENSITIVE_RE.test(k))delete b[k];}
}
/* 舊資料遷移：德性描述+德性表現→文字描述評語；備註→評語代號並移到最左 */
function migrateTeacherCols(s){
  const cols=s.schema.teacher.cols;
  const needMerge=cols.includes('德性描述')||cols.includes('德性表現');
  const needRename=cols.includes('備註');
  if(!needMerge&&!needRename)return;
  for(const st of s.students){
    const t=(st.data&&st.data.teacher)||{};
    for(const row of Object.keys(t)){
      const cell=t[row]||{};
      if(needMerge){
        const parts=[cell['德性描述'],cell['德性表現'],cell['文字描述評語']].map(x=>(x||'').trim()).filter(Boolean);
        const merged=[...new Set(parts)].join('　');
        if(merged)cell['文字描述評語']=merged;
        delete cell['德性描述'];delete cell['德性表現'];
      }
      if(needRename){
        if((cell['備註']||'').trim()&&!(cell['評語代號']||'').trim())cell['評語代號']=cell['備註'];
        delete cell['備註'];
      }
    }
  }
  // 重建欄序：評語代號、文字描述評語、日常表現、特殊表現，保留其餘自訂欄
  const canonical=['評語代號','文字描述評語','日常表現','特殊表現'];
  const drop=['德性描述','德性表現','備註',...canonical];
  s.schema.teacher.cols=[...canonical, ...cols.filter(c=>!drop.includes(c))];
}
/* 舊資料遷移：自評由「全域單一」改為「分六學期」。舊的扁平自評併入高一上。 */
function migrateSelfSem(s){
  for(const st of s.students){
    const self=st.data&&st.data.self; if(!self)continue;
    const alreadySem=SEMS.some(sm=>sm in self);
    if(alreadySem)continue;
    const flatFields=DEFAULT_SCHEMA.self.fields.filter(f=>f in self);
    if(flatFields.length||('_extra'in self)){
      const moved={_extra:self._extra||{}};
      for(const f of DEFAULT_SCHEMA.self.fields) if(f in self)moved[f]=self[f];
      st.data.self={'高一上':moved};
    }
  }
}
/* 舊資料遷移：成績排名單欄 → 班排/類組排雙欄 */
function migrateGradeCols(s){
  const g=s.schema.grade; if(!g)return;
  if(!g.cols.includes('一段考排名'))return;
  for(const st of s.students){
    const gd=(st.data&&st.data.grade)||{};
    for(const row of Object.keys(gd)){
      const cell=gd[row]||{};
      const mv=(o,n)=>{if((cell[o]||'').trim()&&!(cell[n]||'').trim())cell[n]=cell[o];delete cell[o];};
      mv('一段考排名','一段考班排');mv('二段考排名','二段考班排');mv('期末考排名','期末考班排');delete cell['學期排名'];
    }
  }
  g.cols=['一段考班排','一段考類組排','二段考班排','二段考類組排','期末考班排','期末考類組排','較強科目','較弱科目'];
}
function uid(){return 's'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

/* 建立空白學生資料骨架 */
function newStudent(no,name,gender){
  const st={id:uid(),no:no||'',name:name||'',gender:gender||'',data:{}};
  for(const sec of Object.keys(DEFAULT_SCHEMA)){
    if(sec==='basic'){st.data.basic={};}
    else if(sec==='self'){st.data.self={};} // 學生自評改為分學期：{ '高一上':{個性..,_extra:{}} }
    else{st.data[sec]={};}
  }
  return st;
}
function ensureStudentShape(st){
  st.data=st.data||{};
  for(const sec of Object.keys(DEFAULT_SCHEMA)){
    if(sec==='basic')st.data.basic=st.data.basic||{};
    else if(sec==='self')st.data.self=st.data.self||{};
    else st.data[sec]=st.data[sec]||{};
  }
  for(const cs of (state.customSections||[])) st.data[cs.id]=st.data[cs.id]||{};
}
/* 取得/建立某學期的自評資料桶 */
function selfBucket(st,sem){
  st.data.self=st.data.self||{};
  st.data.self[sem]=st.data.self[sem]||{_extra:{}};
  st.data.self[sem]._extra=st.data.self[sem]._extra||{};
  return st.data.self[sem];
}
/* 所有 grid 型區塊（內建 + 自訂），供匯出/篩選使用 */

}

function pctComplete(st){
  // 粗略完成度：基本資料 + 自評八項 填了幾格
  let total=state.schema.basic.fields.length+state.schema.self.fields.length,filled=0;
  for(const f of state.schema.basic.fields) if((st.data.basic[f]||'').trim())filled++;
  const self=st.data.self||{};
  for(const f of state.schema.self.fields) if(SEMS.some(sm=>((self[sm]||{})[f]||'').trim()))filled++;
  return Math.round(filled/total*100);
}

function filterSem(){return state.meta.curSem||(state.ui.sem!=='全部'&&SEMS.includes(state.ui.sem)?state.ui.sem:'');}
const hasAny=o=>!!o&&Object.values(o).some(v=>v&&typeof v==='object'?hasAny(v):String(v||'').trim());

function dutyPick(sel,id,row,col){
  const val=sel.value; sel.selectedIndex=0; if(!val)return;

function parseTSV(text){
  const rows=[];let row=[],cur='',inQ=false;
  text=String(text).replace(/\r\n?/g,'\n').replace(/\n$/,'');
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(inQ){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++;}else inQ=false;}else cur+=ch;}
    else if(ch==='"'&&cur==='')inQ=true;
    else if(ch==='\t'){row.push(cur);cur='';}
    else if(ch==='\n'){row.push(cur);rows.push(row);row=[];cur='';}
    else cur+=ch;
  }
  row.push(cur);rows.push(row);
  return rows;
}
function bindOverview(){
  const t=$('#ovTable');if(!t)return;
  const cell=(r,c)=>t.querySelector(`textarea[data-r="${r}"][data-c="${c}"]`);
  t.addEventListener('input',e=>{
    const ta=e.target;if(ta.tagName!=='TEXTAREA'||!_ov)return;
    const st=_ov.list[+ta.dataset.r],col=_ov.cols[+ta.dataset.c];if(!st||!col)return;
    col.set(st,ta.value);save();updRosterPct(st);updOvCount(+ta.dataset.c);
  });
  t.addEventListener('keydown',e=>{
    const ta=e.target;if(ta.tagName!=='TEXTAREA')return;
    if(e.isComposing||e.keyCode===229)return; // 中文輸入法選字中，Enter 交給輸入法
    if(e.key==='Enter'&&!e.shiftKey&&!e.altKey&&!e.ctrlKey&&!e.metaKey){
      e.preventDefault();
      const nx=cell(+ta.dataset.r+1,+ta.dataset.c);if(nx){nx.focus();nx.select();}
    }
  });
  t.addEventListener('paste',e=>{
    const ta=e.target;if(ta.tagName!=='TEXTAREA'||!_ov)return;
    const txt=(e.clipboardData||window.clipboardData).getData('text');
    if(!txt||!/[\t\n]/.test(txt.replace(/\r?\n$/,'')))return; // 單一格照一般貼上
    e.preventDefault();
    const rows=parseTSV(txt),r0=+ta.dataset.r,c0=+ta.dataset.c;
    const n=Math.min(rows.length,_ov.list.length-r0);
    const targets=_ov.list.slice(r0,r0+n),cols=_ov.cols;
    undoable(`已貼上 ${n} 位學生的資料`,()=>{
      rows.slice(0,n).forEach((row,i)=>row.forEach((v,j)=>{const col=cols[c0+j];if(col)col.set(targets[i],v.trim());}));
    });
    if(rows.length>n)toast(`剪貼簿有 ${rows.length} 列，表格只剩 ${n} 位學生，多出的未貼上`,{type:'warn'});
  });
}

/* 去除得獎/獎懲字眼，只留下「參與了什麼」 */
function stripAwards(s){
  if(!s)return '';
  return String(s)
    .replace(/[（(][^）)]*(獎|名次|第[一二三四五六七八九十\d]+名|優|分|等)[^）)]*[）)]/g,'') // 去括號內含獎/名/優/分說明
    .replace(/(榮獲|獲得|榮獲頒|勇奪|奪得|得到)/g,'')
    .replace(/(特優|優等|優勝|甲等|乙等|丙等|佳作|入選|得獎|獲獎|金獎|銀獎|銅獎|金牌|銀牌|銅牌|獎牌|獎狀|獎項|大獎|首獎|冠軍|亞軍|季軍|殿軍|錦標|滿級分|[一二三]等獎|第[一二三四五六七八九十百\d]+名|前[一二三]名|名次第?\d*)/g,'')
    .replace(/[，,、；;。.\s]+$/,'').replace(/^[，,、；;。.\s]+/,'').replace(/\s{2,}/g,' ').trim();
}
/* 校內外活動 + 特殊/專題 的「參與項目」摘要（不含得獎細節） */
function summarizeActivities(st,sem){
  const ex=((st.data.self||{})[sem]||{})._extra||{};
  const items=[];
  const add=v=>{ const t=stripAwards((v||'').trim()); if(t)items.push(t); };
  ['學校服務','社團表現','學業表現','生活常規','校內其他特殊表現'].forEach(k=>add(ex[k]));   // 校內
  ['社會服務','活動表演','科學展覽','校外其他特殊表現'].forEach(k=>add(ex[k]));               // 校外
  add(((st.data.special||{})[sem]||{})['特殊表現']);                                          // 五、特殊表現（不取獎懲記錄）
  add(((st.data.project||{})[sem]||{})['活動與競賽']);                                        // 八、專題研究（不取獎懲記錄）
  return [...new Set(items.filter(Boolean))];
}
/* 本地整合：文字描述評語＝自評＋活動參與摘要＋成績，形成完整客觀觀察 */
function mergeComment(st,sem){
  const self=(st.data.self||{})[sem]||{};
  const descs=['個性','性情','向學','進取','紀律','交友','服務','擅長'].map(f=>(self[f]||'').trim()).filter(Boolean);
  const acts=summarizeActivities(st,sem);
  const g=(st.data.grade||{})[sem]||{};
  let s='';
  if(descs.length)s+='該生'+descs.join('、')+'。';
  if(acts.length)s+='本學期參與'+acts.join('、')+'等校內外活動，參與態度積極。';
  const rankBits=[];
  for(const e of ['一段考','二段考','期末考']){ const b=(g[e+'班排']||'').trim(), c=(g[e+'類組排']||'').trim(); if(b||c)rankBits.push(`${e}班排名${b||'—'}${c?('、類組'+c):''}`); }
  if(rankBits.length)s+='學業成績方面，'+rankBits.join('；')+'。';
  const strong=(g['較強科目']||'').trim(), weak=(g['較弱科目']||'').trim();
  if(strong)s+=`較強科目為${strong}；`;
  if(weak)s+=`較弱科目為${weak}，可再加強。`;
  return s.trim();
}
function mergeSpecial(st,sem){
  const parts=[];
  const duty=(st.data.duty||{})[sem]||{};
  const dutyBits=[duty['幹部'],duty['小老師']].map(x=>(x||'').trim()).filter(Boolean);
  if(dutyBits.length)parts.push('本學期擔任'+dutyBits.join('、'));
  const ex=((st.data.self||{})[sem]||{})._extra||{};
  const inS=['學校服務','社團表現','學業表現','生活常規','校內其他特殊表現'].map(k=>(ex[k]||'').trim()).filter(Boolean);
  if(inS.length)parts.push('校內表現：'+inS.join('、'));
  const outS=['社會服務','活動表演','科學展覽','校外其他特殊表現'].map(k=>(ex[k]||'').trim()).filter(Boolean);
  if(outS.length)parts.push('校外表現：'+outS.join('、'));
  const sp=(st.data.special||{})[sem]||{};
  const spBits=[sp['特殊表現'],sp['獎懲記錄']].map(x=>(x||'').trim()).filter(Boolean);
  if(spBits.length)parts.push('特殊表現：'+spBits.join('、'));
  const club=(st.data.club||{})[sem]||{};
  const clubBits=[club['社團'],club['職稱'],club['社團表現與活動']].map(x=>(x||'').trim()).filter(Boolean);
  if(clubBits.length)parts.push('社團活動：'+clubBits.join('、'));
  const pj=(st.data.project||{})[sem]||{};
  const pjBits=[pj['活動與競賽'],pj['獎懲記錄']].map(x=>(x||'').trim()).filter(Boolean);
  if(pjBits.length)parts.push('專題研究（科展競賽）：'+pjBits.join('、'));
  return parts.length? parts.join('；')+'。' : '';
}
function doMerge(id,key){
  const s=byId(id); if(!s)return; const sem=getDraftSem(); ensureStudentShape(s);
  const txt = key==='comment'?mergeComment(s,sem):mergeSpecial(s,sem);
  if(!txt)return toast('本學期此類欄位尚無資料可整合');
  const d=draftBucket(s,sem);
  d[key]= d[key].trim()? (d[key].trim()+'\n'+txt) : txt;
  openState['|draft']=true; save(); renderContent(); toast('✓ 已整合本學期資訊到草稿');
}
async function fillOfficial(id,key){
  const s=byId(id); if(!s)return; const sem=getDraftSem();
  const txt=(draftBucket(s,sem)[key]||'').trim();
  if(!txt)return toast('草稿是空的');
  const col=DRAFT_DEFS[key];
  s.data.teacher=s.data.teacher||{}; s.data.teacher[sem]=s.data.teacher[sem]||{};
  if((s.data.teacher[sem][col]||'').trim() && !await confirmBox('覆蓋正式欄位？',`<p>正式「${esc(col)}」欄（${esc(sem)}）已有內容：</p><p class="note" style="white-space:pre-wrap">${esc(s.data.teacher[sem][col])}</p><p>要用草稿覆蓋嗎？</p>`,'覆蓋'))return;
  if(!state.schema.teacher.cols.includes(col))state.schema.teacher.cols.push(col);
  s.data.teacher[sem][col]=txt;
  save(); renderContent(); toast(`✓ 已填入正式「${col}」欄（${sem}）`);
}

function copyText(t){ if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(t).catch(()=>fallbackCopy(t)); return fallbackCopy(t); }
function fallbackCopy(t){ const ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e){} ta.remove(); return Promise.resolve(); }

function copyAndOpen(id,key,url){ const p=aiPayload(id,key); if(!p)return toast('草稿是空的'); copyText(p.text).then(()=>{ window.open(url,'_blank'); toast('📋 已複製（含提示詞'+(p.cfg.deid?'，已去識別化':'')+'），請於開啟的網站貼上'); }); }

/* 去識別化：姓名（全名與名字）改為「該生」，電話改為［電話］ */
function deidentify(txt,st){
  let out=String(txt||'');
  const nm=(st&&st.name||'').trim();
  const names=[nm,nm.length>=3?nm.slice(1):''].filter(x=>x&&x.length>=2).sort((a,b)=>b.length-a.length);
  for(const n of names)out=out.split(n).join('該生');
  return out.replace(/0\d{1,3}[-\s]?\d{3,4}[-\s]?\d{3,4}/g,'［電話］');
}
function aiPayload(id,key){const s=byId(id),cfg=getAICfg();const txt=(draftBucket(s,getDraftSem())[key]||'').trim();if(!txt)return null;return {cfg,text:getPrompt(key)+'\n\n'+(cfg.deid?deidentify(txt,s):txt)};}

async function callAI(cfg,content){
  if(!cfg.apiKey)throw new Error('尚未設定 API 金鑰');
  if(cfg.provider==='gemini'){
    const model=cfg.model||AI_MODEL_PH.gemini;
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(cfg.apiKey)}`,
      {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:content}]}]})});
    const j=await r.json(); if(!r.ok)throw new Error((j.error&&j.error.message)||('HTTP '+r.status));
    return (((j.candidates||[])[0]||{}).content||{}).parts?.[0]?.text||'';
  }
  if(cfg.provider==='openai'){
    const model=cfg.model||AI_MODEL_PH.openai;
    const r=await fetch('https://api.openai.com/v1/chat/completions',
      {method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.apiKey},body:JSON.stringify({model,messages:[{role:'user',content}]})});
    const j=await r.json(); if(!r.ok)throw new Error((j.error&&j.error.message)||('HTTP '+r.status));
    return (((j.choices||[])[0]||{}).message||{}).content||'';
  }
  if(cfg.provider==='claude'){
    const model=cfg.model||AI_MODEL_PH.claude;
    const r=await fetch('https://api.anthropic.com/v1/messages',
      {method:'POST',headers:{'Content-Type':'application/json','x-api-key':cfg.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model,max_tokens:1024,messages:[{role:'user',content}]})});
    const j=await r.json(); if(!r.ok)throw new Error((j.error&&j.error.message)||('HTTP '+r.status));
    return (((j.content||[])[0])||{}).text||'';
  }
  throw new Error('未知的 AI 服務');
}

  const inp=document.createElement('input');inp.type='file';

// CSV → 二維陣列（全部視為文字，保留電話前導 0 與括號，避免被當數字）
function parseCSV(text){
  const rows=[]; let row=[],cur='',inQ=false;
  text=String(text).replace(/^﻿/,'').replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(inQ){ if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else inQ=false; } else cur+=ch; }
    else{
      if(ch==='"')inQ=true;
      else if(ch===','){row.push(cur);cur='';}
      else if(ch==='\n'){row.push(cur);rows.push(row);row=[];cur='';}
      else cur+=ch;
    }
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows;
}
function handleFile(type,file){
  const reader=new FileReader();
  const isCSV=/\.csv$/i.test(file.name);
  reader.onload=ev=>{
    if(type!=='json'&&state.students.length)makeSnapshot(`匯入「${file.name}」前`);
    setTimeout(()=>{const a=$('#impArea');if(a&&a.innerHTML.trim())a.scrollIntoView({behavior:'smooth',block:'start'});},80);
    try{
      if(type==='json')return importJSON(ev.target.result,file.name);
      if(type==='dutyassign'&&/\.json$/i.test(file.name))return importDutyAssignmentJSON(ev.target.result,file.name);
      if(type==='docx')return importDocx(ev.target.result,file.name);
      let wb;
      if(isCSV){ const ws=XLSX.utils.aoa_to_sheet(parseCSV(ev.target.result)); wb={SheetNames:['CSV'],Sheets:{CSV:ws}}; }
      else wb=XLSX.read(ev.target.result,{type:'array'});
      if(type==='roster')importRoster(wb);
      else if(type==='selfxlsx')importSelfXlsx(wb);
      else if(type==='form')importForm(wb);
      else if(type==='basicxlsx')importBasicXlsx(wb);
      else if(type==='prevcomment')importPrevComment(wb);
      else if(type==='gradexlsx')importGrade(wb);
      else if(type==='mockxlsx')importMock(wb);
      else if(type==='clubxlsx')importClub(wb);
      else if(type==='dutyassign')importDutyAssignmentExcel(wb,file.name);
    }catch(err){alert('匯入失敗：'+err.message);console.error(err);}
  };
  if(type==='json'||(type==='dutyassign'&&/\.json$/i.test(file.name))||isCSV)reader.readAsText(file); // CSV 以 UTF-8 文字讀取
  else reader.readAsArrayBuffer(file);
}

function dutyNorm(v){return String(v==null?'':v).trim().normalize('NFKC');}
function dutySemOptions(id){return `<select id="${id}">${SEMS.map(s=>`<option ${s===state.ui.sem&&state.ui.sem!=='全部'?'selected':''}>${s}</option>`).join('')}</select>`;}
function importDutyAssignmentJSON(txt,fileName){
  let obj;try{obj=JSON.parse(txt);}catch(e){return alert('JSON 格式錯誤，無法讀取幹部／小老師分配資料。');}
  if(!obj||!Array.isArray(obj.students)||!obj.tasks||typeof obj.tasks!=='object')return alert('無法辨識此 JSON。需要包含 students 名冊及 tasks.officer／tasks.tutor 職務資料。');
  const sourceById=new Map(obj.students.filter(s=>s&&s.id!=null).map(s=>[String(s.id),s]));
  const records=[];let empty=0,unlinked=0;
  for(const [key,category] of [['officer','幹部'],['tutor','小老師']]){
    const tasks=Array.isArray(obj.tasks[key])?obj.tasks[key]:[];
    for(const task of tasks){
      const studentId=task&&task.studentId!=null?String(task.studentId):'';
      if(!studentId){empty++;continue;}
      const source=sourceById.get(studentId);
      if(!source){unlinked++;continue;}
      const position=dutyNorm(task.name||task.title||task.position);
      if(!position)continue;
      records.push({no:source.no,name:source.name,category,position});
    }
  }
  if(!records.length)return alert('檔案中沒有已分配學生的幹部或小老師職務。');
  _dutyImportRecords=records;
  _dutyImportCategories=new Set(['幹部','小老師']);
  showDutyImportPreview(fileName,{empty,unlinked});
}

function buildDutyExcelPreview(){
  const noCol=$('#diNo').value,nameCol=$('#diName').value,catCol=$('#diCategory').value,posCol=$('#diPosition').value;
  if(noCol===''||nameCol==='')return alert('請指定座號與姓名欄位。');
  const records=[];
  for(const row of _dutyXlsx.rows){
    const no=row[Number(noCol)],name=row[Number(nameCol)];
    if(dutyNorm(no)===''&&dutyNorm(name)==='')continue;
    if(catCol==='__wide'){
      for(const category of ['幹部','小老師']){
        const ci=_dutyXlsx.headers.findIndex(h=>h===category||h.includes(category));
        if(ci>=0&&dutyNorm(row[ci]))records.push({no,name,category,position:dutyNorm(row[ci])});
      }
    }else{
      if(catCol===''||posCol==='')continue;
      const rawCat=dutyNorm(row[Number(catCol)]),rawPos=dutyNorm(row[Number(posCol)]);
      const category=/小老師|小先生|科目老師/.test(rawCat)?'小老師':/幹部|股長/.test(rawCat)?'幹部':'';
      if(category&&rawPos)records.push({no,name,category,position:rawPos});
    }
  }
  if(!records.length)return alert('未找到可匯入資料。請確認類別欄內容包含「幹部／小老師」，且職務名稱欄有資料。');
  _dutyImportRecords=records;_dutyImportCategories=new Set(['幹部','小老師']);showDutyImportPreview(_dutyXlsx.fileName,{} ,'#diPreview');
}
function showDutyImportPreview(fileName,extra={},target='#impArea'){

  for(const r of records){
    const no=dutyNorm(r.no),name=dutyNorm(r.name);
    const matches=state.students.filter(s=>dutyNorm(s.no)===no&&dutyNorm(s.name)===name);
    if(matches.length===1){

    }else{
      if(matches.length>1)ambiguous++;

      unmatched.push({no,name,category:r.category,position:r.position});
    }

  const rows=[...byKey.values()];
  const matchedStudentCount=new Set(rows.map(x=>x.student.id)).size;
  const officerCount=allRecords.filter(r=>r.category==='幹部').length,tutorCount=allRecords.filter(r=>r.category==='小老師').length;

  const preview=rows.slice(0,12).map(x=>`<tr><td>${esc(x.student.no)}</td><td>${esc(x.student.name)}</td><td>${esc(x.category)}</td><td>${esc(x.positions.join('、'))}</td></tr>`).join('');
  const unmatchedHtml=unmatched.length?`<details style="margin:8px 0"><summary>未比對成功 ${unmatched.length} 筆（不會匯入）</summary><div class="gridwrap"><table><thead><tr><th>座號</th><th>姓名</th><th>類別</th><th>職務</th></tr></thead><tbody>${unmatched.slice(0,30).map(x=>`<tr><td>${esc(x.no)}</td><td>${esc(x.name)}</td><td>${esc(x.category)}</td><td>${esc(x.position)}</td></tr>`).join('')}</tbody></table></div>${unmatched.length>30?`<div class="hint">另有 ${unmatched.length-30} 筆未顯示。</div>`:''}</details>`:'';
  targetEl.innerHTML=`<div class="note"><b>檔案：</b>${esc(fileName)}　<b>已選類別：</b>${selectedCategories.length?selectedCategories.join('、'):'未選擇'}　<b>職務記錄：</b>${records.length} 筆　<b>成功比對：</b>${matchedStudentCount} 位學生（${rows.length} 個類別記錄）　<b>未比對：</b>${unmatched.length} 筆${extra.empty?`　<b>空缺略過：</b>${extra.empty} 項`:''}${extra.unlinked?`　<b>來源連結缺漏：</b>${extra.unlinked} 項`:''}${noNameMismatch?`　（座號相同但姓名不符：${noNameMismatch} 筆）`:''}${ambiguous?`　（名冊重複：${ambiguous} 筆）`:''}</div>
    ${categoryChooser}
    <div class="fields" style="margin:10px 0"><div class="fld"><label>匯入到學期</label><select id="diSem" onchange="_dutyImportSem=this.value">${SEMS.map(s=>`<option ${s===_dutyImportSem?'selected':''}>${s}</option>`).join('')}</select></div><div class="fld"><label>匯入方式</label><select id="diMode" onchange="_dutyImportMode=this.value"><option value="merge" ${_dutyImportMode==='merge'?'selected':''}>合併（保留原內容並附加新職務）</option><option value="replace" ${_dutyImportMode==='replace'?'selected':''}>取代所選類別在該學期全班的資料</option></select></div></div>
    ${rows.length?`<div class="gridwrap"><table><thead><tr><th>座號</th><th>姓名</th><th>類別</th><th>匯入職務</th></tr></thead><tbody>${preview}</tbody></table></div>${rows.length>12?`<div class="hint">另有 ${rows.length-12} 筆成功比對的職務記錄，已納入匯入。</div>`:''}`:'<div class="note">沒有任何資料同時符合座號與姓名，請檢查名冊或匯入檔。</div>'}
    ${unmatchedHtml}<div style="margin-top:10px"><button class="btn pri" ${rows.length?'':'disabled'} onclick="applyDutyAssignmentImport()">✓ 確認匯入 ${matchedStudentCount} 位學生</button></div>`;

function setDutyImportCategory(category,checked){
  _dutyImportSem=$('#diSem')?.value||_dutyImportSem;
  _dutyImportMode=$('#diMode')?.value||_dutyImportMode;
  if(checked)_dutyImportCategories.add(category);else _dutyImportCategories.delete(category);
  showDutyImportPreview(_dutyImportFileName,_dutyImportExtra,_dutyImportTarget);
}
async function applyDutyAssignmentImport(){
  const sem=$('#diSem')?.value,mode=$('#diMode')?.value;
  if(!sem)return alert('請選擇匯入學期。');
  const grouped=new Map();
  for(const r of _dutyImportRecords){
    if(!_dutyImportCategories.has(r.category))continue;
    const matches=state.students.filter(s=>dutyNorm(s.no)===dutyNorm(r.no)&&dutyNorm(s.name)===dutyNorm(r.name));
    if(matches.length!==1)continue;
    const s=matches[0],key=s.id+'|'+r.category;
    if(!grouped.has(key))grouped.set(key,{student:s,category:r.category,positions:[]});
    const item=grouped.get(key);if(!item.positions.includes(r.position))item.positions.push(r.position);
  }
  if(!grouped.size)return alert('目前名冊中沒有可匯入的精確比對資料。');
  const categories=[..._dutyImportCategories].filter(c=>c==='幹部'||c==='小老師');
  if(!categories.length)return alert('請至少勾選一種職務類別。');
  if(mode==='replace'&&!await confirmBox('取代全班職務？',`<p>確定取代「${esc(sem)}」全班的「${esc(categories.join('、'))}」資料？所選欄位目前內容會清除，再寫入檔案中的已分配職務。</p><p class="hint">取代前已自動留一份還原點。</p>`,'取代','danger'))return;
  if(mode==='replace')for(const s of state.students){ensureStudentShape(s);s.data.duty[sem]=s.data.duty[sem]||{};for(const c of categories)s.data.duty[sem][c]='';}
  for(const x of grouped.values()){
    const s=x.student;ensureStudentShape(s);s.data.duty[sem]=s.data.duty[sem]||{};
    const old=String(s.data.duty[sem][x.category]||'').split(/[、\n]+/).map(v=>v.trim()).filter(Boolean);
    const add=x.positions.filter(v=>!old.includes(v));s.data.duty[sem][x.category]=[...old,...add].join('、');
  }
  const studentCount=new Set([...grouped.values()].map(x=>x.student.id)).size;
  save();render();closeModal();toast(`✓ 幹部／小老師匯入完成：${studentCount} 位學生（${sem}）`);
}

function sheetToRows(ws){return XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false});}
function guessCol(headers,keys){

function rosterPreview(){
  const sheet=$('#rsSheet').value, ws=_rosterWB.Sheets[sheet];

function doImportRoster(hdrIdx){
  const ws=_rosterWB.Sheets[$('#rsSheet').value];
  const rows=sheetToRows(ws).filter(r=>r.some(c=>String(c).trim()!==''));
  const dataRows=rows.slice(hdrIdx+1).filter(r=>r.some(c=>String(c).trim()!==''));
  const noCol=+$('#rsNo').value, nameCol=+$('#rsName').value;
  if($('#rsReplace').checked)state.students=[];
  if(!state.meta.className)state.meta.className=$('#rsSheet').value;
  let added=0,updated=0;
  for(const r of dataRows){
    const no=String(r[noCol]||'').trim(), name=String(r[nameCol]||'').trim();
    if(!name&&!no)continue;
    let s=state.students.find(x=>x.name===name&&name)||state.students.find(x=>x.no===no&&no&&!x.name);
    if(s){if(no)s.no=no;if(name)s.name=name;updated++;}
    else{state.students.push(newStudent(no,name,''));added++;}
  }
  save();render();closeModal();
  toast(`✓ 名冊匯入完成：新增 ${added} 位、更新 ${updated} 位`);
}

let _selfData=null;
function importSelfXlsx(wb){
  const ws=wb.Sheets[wb.SheetNames[0]];

function doImportSelfXlsx(){
  const sem=$('#sxSem').value, data=_selfData;
  const map={'學校服務':'學校服務','社團表現':'社團表現','學業表現':'學業表現','生活常規':'生活常規',
    '校內其他特殊表現':'校內其他特殊表現','社會服務':'社會服務','活動表演':'活動表演','科學展覽':'科學展覽',
    '校外其他特殊表現':'校外其他特殊表現','備註':'備註'};
  let matched=0,unmatched=[];
  for(const row of data){
    const name=String(row['學生姓名']||row['姓名']||'').trim();
    if(!name)continue;
    let s=findStu(name,row['座號']);
    if(!s){unmatched.push(name);continue;}
    ensureStudentShape(s);
    if(row['性別']&&!s.gender)s.gender=String(row['性別']).trim();
    const b=selfBucket(s,sem);
    for(const [col,target] of Object.entries(map)){
      const v=String(row[col]||'').trim();

function ensureExtra(name){if(!state.schema.self.extra.includes(name))state.schema.self.extra.push(name);}

function doImportForm(){
  const sem=$('#fmSem').value;
  const colMap=_formHeaders.map((h,i)=>$('#fm_'+i).value);
  const nameIdx=colMap.indexOf('__name'), noIdx=colMap.indexOf('__no');
  if(nameIdx<0)return alert('請先指定「姓名」欄位。');
  let matched=0,unmatched=[];
  for(const row of _formData){
    const name=String(row[_formHeaders[nameIdx]]||'').trim();
    if(!name)continue;
    let s=state.students.find(x=>x.name===name);
    if(!s&&noIdx>=0){const no=String(row[_formHeaders[noIdx]]||'').trim();s=no?state.students.find(x=>x.no===no):null;}
    if(!s){unmatched.push(name);continue;}
    ensureStudentShape(s);
    const b=selfBucket(s,sem);
    colMap.forEach((target,i)=>{
      const val=String(row[_formHeaders[i]]||'').trim();
      if(!val||target.startsWith('__')){
        if(target==='__gender'&&val&&!s.gender)s.gender=val;
        if(target==='__no'&&val&&!s.no)s.no=val;
        return;
      }
      const [kind,key]=target.split(':');
      if(kind==='self'){b[key]=mergeText(b[key],val);}
      else if(kind==='extra'){ensureExtra(key);b._extra[key]=mergeText(b._extra[key],val);}
      else if(kind==='duty'){s.data.duty[sem]=s.data.duty[sem]||{};s.data.duty[sem][key]=mergeText(s.data.duty[sem][key],val);}
    });
    matched++;
  }
  save();render();closeModal();
  toast(`✓ 問卷匯入：成功 ${matched} 位`+(unmatched.length?`，未找到 ${unmatched.length} 位`:''));
  if(unmatched.length)setTimeout(()=>alert('以下姓名找不到對應學生：\n'+unmatched.join('、')),300);
}

  if(/姓名|學生|名字/.test(h)&&!/監護|家長|父|母/.test(h))return '__name';
  if(/性別/.test(h))return '__gender';
  if(/父/.test(h))return /電話|手機|行動/.test(h)?'basic:父手機':'basic:父姓名';
  if(/母/.test(h))return /電話|手機|行動/.test(h)?'basic:母手機':'basic:母姓名';

  if(/電話（公）|電話\(公\)|公司電話|公電/.test(h))return '__skip';
  if(/現在住址|住址|地址/.test(h))return 'basic:住址';

}

function guessGuardianGender(name){
  name=String(name||'').trim(); if(!name)return '?';
  const given=name.length>=2?name.slice(1):name; // 去掉姓氏第一字，掃描名
  let f=0,m=0;
  for(const ch of given){ if(FEMALE_CHARS.includes(ch))f++; if(MALE_CHARS.includes(ch))m++; }
  if(f>m)return 'F'; if(m>f)return 'M'; return '?';
}

function doImportBasic(){
  const {aoa,HR}=_basicAOA, cols=_basicCols;
  const colMap=cols.map((c,idx)=>$('#bm_'+idx).value);
  const colIdxOf=t=>{const k=colMap.indexOf(t);return k>=0?cols[k].i:-1;};
  const nameI=colIdxOf('__name'); if(nameI<0)return alert('請先指定「姓名」欄位。');
  const noI=colIdxOf('__no'), genI=colIdxOf('__gender');
  const gI=colIdxOf('__guardian'), gpI=colIdxOf('__guardianphone'), relI=colIdxOf('__relation');
  const addField=f=>{ if(!state.schema.basic.fields.includes(f))state.schema.basic.fields.push(f); };
  let matched=0,created=0;
  for(let r=HR+1;r<aoa.length;r++){
    const row=aoa[r];
    const name=String(row[nameI]||'').trim();
    const no=noI>=0?String(row[noI]||'').trim():'';
    if(!name&&!no)continue;
    let s=findStu(name,no);
    if(!s){s=newStudent(no,name,'');state.students.push(s);created++;}
    else matched++;
    ensureStudentShape(s);
    if(no&&!s.no)s.no=no;
    if(genI>=0){const g=String(row[genI]||'').trim();if(g&&!s.gender)s.gender=g;}
    // 一般欄位
    cols.forEach((c,idx)=>{
      const t=colMap[idx]; if(t!=='__newfield'&&!t.startsWith('basic:'))return;
      const val=String(row[c.i]||'').trim(); if(!val)return;
      const f= t==='__newfield'? c.name : t.slice(6);
      if(SENSITIVE_RE.test(f))return; // v3.0：身分證字號不匯入
      addField(f); s.data.basic[f]=val;
    });
    // 監護人依關係自動分父/母
    if(gI>=0||gpI>=0){
      const gname=gI>=0?String(row[gI]||'').trim():'';
      const gphone=gpI>=0?String(row[gpI]||'').trim():'';
      const rel=relI>=0?String(row[relI]||'').trim():'';
      if(gname||gphone){
        // 關係欄優先；無明確關係時，依監護人姓名文字意義自動判斷父/母（不確定預設父）
        let isMother;
        if(/父/.test(rel))isMother=false;
        else if(/母/.test(rel))isMother=true;
        else isMother=(guessGuardianGender(gname)==='F');
        const nf=isMother?'母姓名':'父姓名', pf=isMother?'母手機':'父手機';
        addField(nf);addField(pf);
        if(gname)s.data.basic[nf]=gname;
        if(gphone)s.data.basic[pf]=gphone;
      }
    }
  }
  reorderBasicFields(state); // 住家電話排到父手機右邊、母欄對齊父欄
  save();render();closeModal();
  toast(`✓ 基本資料匯入：更新 ${matched} 位、新增 ${created} 位`);
}

function guessPCTarget(h){

  if(/電子郵件|email|時間戳記|timestamp/i.test(h))return '__skip';

const GNORM=s=>String(s).replace(/[\s\n　]/g,'');
let _gradeAOA=null,_gradeCols=null;
function importGrade(wb){
  const ws=wb.Sheets[wb.SheetNames[0]];
  const aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
  let HR=aoa.findIndex(r=>r.some(c=>GNORM(c).includes('座號'))&&r.some(c=>/姓名/.test(GNORM(c))));
  if(HR<0)return alert('無法辨識段考成績表頭（需含「座號」與「姓名」）。');
  const hdr=aoa[HR].map(GNORM);
  const META=/座號|姓名|總分|平均|不及格|名次|進退|百分|備註|級分|學號/;
  const cols={
    no:hdr.findIndex(h=>h.includes('座號')),
    name:hdr.findIndex(h=>/姓名/.test(h)),
    ban:hdr.findIndex(h=>h.includes('班級')&&h.includes('名次')),
    cu:hdr.findIndex(h=>h.includes('類組')&&h.includes('名次')&&!h.includes('百分')),
    cupct:hdr.findIndex(h=>h.includes('類組')&&h.includes('百分')),
    subj:[]
  };
  if(cols.cu<0)cols.cu=hdr.findIndex(h=>(h.includes('全校')||h.includes('校'))&&h.includes('名次'));
  hdr.forEach((h,i)=>{ if(h&&!META.test(h)&&i!==cols.no&&i!==cols.name)cols.subj.push([i,h]); });
  _gradeAOA={aoa,HR}; _gradeCols=cols;
  const cnt=aoa.slice(HR+1).filter(r=>String(r[cols.name]||'').trim()).length;
  $('#impArea').innerHTML=`
    <div class="ok">已讀取段考成績，偵測 <b>${cnt}</b> 位學生。科目：${cols.subj.map(s=>s[1]).join('、')||'（未偵測，請確認檔案）'}</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <div class="fld" style="flex:1"><label>匯入到哪個學期</label><select id="grSem">${SEMS.map(s=>`<option ${s===state.ui.sem&&state.ui.sem!=='全部'?'selected':''}>${s}</option>`).join('')}</select></div>
      <div class="fld" style="flex:1"><label>哪一次考試</label><select id="grExam"><option>一段考</option><option>二段考</option><option>期末考</option></select></div>
    </div>
    <div class="note">較強科目＝該科 80 分(含)以上；較弱科目＝不及格（分數前有 #）。班排取「班級名次」、類組排取「類組名次（百分）」。同學期多次考試的相同科目會去重並標註出現次數，例如「數學(2)」。</div>
    <button class="btn pri" onclick="doImportGrade()">✓ 開始匯入</button>`;
}
function doImportGrade(){
  const sem=$('#grSem').value, exam=$('#grExam').value;
  const {aoa,HR}=_gradeAOA, c=_gradeCols;
  let matched=0,unmatched=[];
  for(let r=HR+1;r<aoa.length;r++){
    const row=aoa[r]; const name=String(row[c.name]||'').trim(), no=String(row[c.no]||'').trim();
    if(!name)continue;
    const s=findStu(name,no); if(!s){unmatched.push(name);continue;}
    ensureStudentShape(s);
    const strong=[],weak=[];
    for(const [i,sub] of c.subj){
      const raw=String(row[i]||'').trim(); if(!raw)continue;
      if(raw.indexOf('#')>=0)weak.push(sub);
      else{const n=parseFloat(raw.replace(/[^0-9.]/g,'')); if(!isNaN(n)&&n>=80)strong.push(sub);}
    }
    const ban=c.ban>=0?String(row[c.ban]||'').trim():'';
    let cu=c.cu>=0?String(row[c.cu]||'').trim():'';
    const pct=c.cupct>=0?String(row[c.cupct]||'').trim():'';
    if(cu&&pct)cu=cu+'（'+pct+'%）';
    s.data._exam=s.data._exam||{}; s.data._exam[sem]=s.data._exam[sem]||{};
    s.data._exam[sem][exam]={ban,cu,strong,weak};
    recomputeGrade(s,sem);
    matched++;
  }
  save();render();closeModal();

function recomputeGrade(s,sem){
  s.data.grade[sem]=s.data.grade[sem]||{};
  const g=s.data.grade[sem], ex=(s.data._exam||{})[sem]||{}, EXAMS=['一段考','二段考','期末考'];
  for(const e of EXAMS){ if(ex[e]){ g[e+'班排']=ex[e].ban||''; g[e+'類組排']=ex[e].cu||''; } }
  const tally=key=>{const m={};for(const e of EXAMS){for(const sub of ((ex[e]||{})[key]||[]))m[sub]=(m[sub]||0)+1;}
    return Object.entries(m).map(([sub,n])=>n>1?`${sub}(${n})`:sub).join('、');};
  g['較強科目']=tally('strong'); g['較弱科目']=tally('weak');
}

function importDocx(arrayBuffer,fname){

    const fields=['個性','性情','向學','進取','紀律','交友','服務','擅長'];
    const grabbed={};

  }};

// 依項目順序組出單一學生的 AOA（一→九→自訂，不可顛倒）
function buildStudentAOA(st,sel,sem){
  const aoa=[];
  aoa.push([`${state.meta.className||''} 學生資料表`,'','','']);
  aoa.push([`座號`,st.no||'',`姓名`,st.name||'',`性別`,st.gender||'']);
  aoa.push([`導師`,state.meta.teacher||'',`輸出學期`,sem,`輸出日`,dstamp()]);
  aoa.push([]);
  const orderList=[...SECTION_ORDER.map(([id,title,ic,kind])=>({id,title,kind})), ...(state.customSections||[]).map(c=>({id:c.id,title:c.title,kind:'grid'}))];
  for(const {id,title,kind} of orderList){
    if(!sel.has(id))continue;
    if(kind==='fields'){
      aoa.push([title]);
      const bf=state.schema[id].fields;
      for(let i=0;i<bf.length;i+=2){aoa.push([bf[i],(st.data[id]||{})[bf[i]]||'',bf[i+1]||'',bf[i+1]?((st.data[id]||{})[bf[i+1]]||''):'']);}
      aoa.push([]);
    }else if(kind==='self'){
      aoa.push([title]);
      const selfSems = sem==='全部'?SEMS:[sem];
      for(const sm of selfSems){
        const b=(st.data.self||{})[sm]||{};
        const hasCore=state.schema.self.fields.some(f=>(b[f]||'').trim());
        const exCols=state.schema.self.extra.filter(f=>((b._extra||{})[f]||'').trim());
        if(!hasCore&&!exCols.length)continue;
        aoa.push(['【'+sm+'】']);
        for(const f of state.schema.self.fields)aoa.push([f+'描述',b[f]||'']);
        if(exCols.length){aoa.push(['（自評補充）']);for(const f of exCols)aoa.push([f,b._extra[f]]);}
      }
      aoa.push([]);
    }else{
      const sc=state.schema[id];
      aoa.push([title]);
      aoa.push([sc.noSemFilter?'項目':'學期',...sc.cols]);
      const rows=(sc.noSemFilter||sem==='全部')?sc.rows:[sem];
      for(const r of rows){ aoa.push([r,...sc.cols.map(c=>((st.data[id]||{})[r]||{})[c]||'')]); }
      aoa.push([]);
    }
  }
  return aoa;
}

/* ---------- IndexedDB ---------- */
let dbPromise=null;
function idbOpen(){
  if(dbPromise)return dbPromise;
  dbPromise=new Promise((resolve,reject)=>{
    if(typeof indexedDB==='undefined'||!indexedDB)return reject(new Error('瀏覽器不支援或停用了 IndexedDB'));
    const req=indexedDB.open(IDB_NAME,IDB_VERSION);
    req.onupgradeneeded=()=>{const db=req.result;
      if(!db.objectStoreNames.contains('kv'))db.createObjectStore('kv');
      if(!db.objectStoreNames.contains('snapshots'))db.createObjectStore('snapshots');};
    req.onsuccess=()=>{req.result.onversionchange=()=>req.result.close();resolve(req.result);};
    req.onerror=()=>reject(req.error||new Error('IndexedDB 開啟失敗'));
    req.onblocked=()=>reject(new Error('IndexedDB 被其他分頁鎖住'));
  });
  dbPromise.catch(()=>{dbPromise=null;});
  return dbPromise;
}
async function idbTx(storeName,mode,fn){
  const db=await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(storeName,mode);const req=fn(tx.objectStore(storeName));let out;
    if(req)req.onsuccess=()=>{out=req.result;};
    tx.oncomplete=()=>resolve(out);tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||new Error('交易中止'));
  });
}
const idbGet=(s,k)=>idbTx(s,'readonly',st=>st.get(k));
const idbPut=(s,k,v)=>idbTx(s,'readwrite',st=>st.put(v,k));
const idbDel=(s,k)=>idbTx(s,'readwrite',st=>st.delete(k));
const idbAll=s=>idbTx(s,'readonly',st=>st.getAll());

function writeMirror(payload){
  try{localStorage.setItem(LS_KEY,JSON.stringify(payload));store.mirrorOk=true;}
  catch(e){store.mirrorOk=false;if(store.mode==='idb'){try{localStorage.removeItem(LS_KEY);}catch(_){}}} // 避免留下過期的鏡像
}
async function commitLocal(data,savedAt){
  const payload={...data,savedAt,rev:meta.rev+1,appVersion:APP_VERSION};
  let ok=false;
  if(store.mode==='idb'){
    try{await idbPut('kv','state',payload);ok=true;dailySnapshot(payload).catch(()=>{});}
    catch(e){store.mode='ls';console.warn('IndexedDB 寫入失敗，改用 localStorage 後援',e);}
  }
  writeMirror(payload);
  if(store.mode==='ls')ok=store.mirrorOk;
  if(!ok)throw new Error('IndexedDB 與 localStorage 都無法寫入（瀏覽器空間可能已滿）');
  meta.rev=payload.rev;meta.savedAt=savedAt;store.lastSavedAt=Date.now();store.error='';
  if(bc)bc.postMessage({type:'saved',rev:meta.rev,from:tabId});
  return payload;
}
/* 所有修改都呼叫 save()：0.3 秒合併寫入 */
/* 共享整合版：資料寫入工作站共用資料庫（bridge.js 負責實際寫入與跨分頁同步） */
function wsWrite(){
  clearTimeout(saveTimer);

  dirty=false;
  try{workspaceStorage.setItem(LS_KEY,JSON.stringify(currentData()));store.lastSavedAt=Date.now();store.error='';}
  catch(e){dirty=true;store.error='儲存失敗';toast('未儲存：'+(e.message||e),{type:'err'});}
  renderSaveTag();
}
function save(){
  if(!booted)return;
  state.meta.updatedAt=new Date().toISOString();
  if(WS){dirty=true;clearTimeout(saveTimer);saveTimer=setTimeout(wsWrite,300);renderSaveTag();return;}
  dirty=true;folder.dirty=true;
  clearTimeout(saveTimer);saveTimer=setTimeout(flushSave,300);
  renderSaveTag();
}
async function flushSave(){
  if(WS)return wsWrite();
  clearTimeout(saveTimer);
  if(!booted||!dirty)return;
  if(savingPromise){await savingPromise;return flushSave();}
  savingPromise=doSave().finally(()=>{savingPromise=null;renderSaveTag();});
  return savingPromise;
}
async function doSave(){
  store.saving=true;renderSaveTag();
  try{
    if(store.mode==='idb'){
      let cur=null;try{cur=await idbGet('kv','state');}catch(_){}
      if(cur&&(cur.rev||0)>meta.rev){await handleTabConflict(cur);return;}
    }
    dirty=false;
    await commitLocal(currentData(),Date.now());
    scheduleFolderWrite();
  }catch(e){
    dirty=true;store.error='儲存失敗';
    toast('⚠ 儲存失敗：'+(e.message||e)+'。請到「資料存放與還原」下載 JSON 備份。',{type:'err'});
  }finally{store.saving=false;}
}
async function saveNow(){

  dirty=true;folder.dirty=true;
  await flushSave();
  if(folder.handle&&['ok','error'].includes(folder.status)){clearTimeout(folder.timer);await writeMaster();}
  if(!store.error)toast(folder.status==='ok'?'✓ 已儲存（這台電腦＋資料夾）':'✓ 已儲存到這台電腦');

async function handleTabConflict(cur){

/* ---------- 自動還原點 ---------- */
async function dailySnapshot(payload){
  const id='day-'+dayStamp();
  if(!await idbGet('snapshots',id))await idbPut('snapshots',id,{id,at:Date.now(),reason:'每日自動',data:payload});
  await pruneSnapshots();
}
async function makeSnapshot(reason,data){
  if(store.mode!=='idb'||!booted)return false;
  try{
    const id=`evt-${minuteStamp()}-${Date.now()%100000}`;
    await idbPut('snapshots',id,{id,at:Date.now(),reason,data:data||currentData()});
    await pruneSnapshots();
    if($('#snapshotList'))renderSnapshots();
    return true;
  }catch(e){return false;}
}
async function pruneSnapshots(){
  const all=await idbAll('snapshots');
  const days=all.filter(s=>s.id.startsWith('day-')).sort((a,b)=>b.id.localeCompare(a.id));
  const evts=all.filter(s=>s.id.startsWith('evt-')).sort((a,b)=>b.at-a.at);
  for(const s of [...days.slice(DAILY_SNAP_KEEP),...evts.slice(EVENT_SNAP_KEEP)])await idbDel('snapshots',s.id);
}
let _snapList=[];
async function renderSnapshots(){
  const box=$('#snapshotList');if(!box)return;
  if(store.mode!=='idb'){box.innerHTML='<p class="hint">此瀏覽器目前無法使用 IndexedDB，因此沒有自動還原點。請定期下載 JSON 備份。</p>';return;}
  try{_snapList=(await idbAll('snapshots')).sort((a,b)=>b.at-a.at);}catch(e){_snapList=[];}
  if(!_snapList.length){box.innerHTML='<p class="hint">目前還沒有還原點。開始編輯後，每天會自動留一份。</p>';return;}
  box.innerHTML=`<div class="gridwrap" style="max-height:300px;overflow:auto"><table class="snaptbl" style="min-width:520px"><thead><tr><th>時間</th><th>原因</th><th>內容</th><th></th></tr></thead><tbody>
    ${_snapList.map(s=>`<tr><td style="white-space:nowrap">${esc(fmtTime(s.at))}</td><td>${esc(s.reason)}</td><td>${esc(countsText(s.data))}</td>
      <td style="white-space:nowrap"><button class="btn sm" onclick="restoreSnapshot('${jsq(s.id)}')">↩ 還原</button> <button class="btn sm" onclick="downloadSnapshot('${jsq(s.id)}')">⬇ 下載</button>${s.id.startsWith('old-')?` <button class="btn sm danger" onclick="deleteSnapshot('${jsq(s.id)}')">刪除</button>`:''}</td></tr>`).join('')}
    </tbody></table></div>`;
}
function downloadSnapshot(id){
  const s=_snapList.find(x=>x.id===id);if(!s)return;
  download(new Blob([JSON.stringify(s.data,null,2)],{type:'application/json'}),safeName(`班級學生資料_還原點_${s.id}`)+'.json');

/* ---------- 舊版資料（v2：localStorage「班級備份庫」） ---------- */
function readLegacyBackups(){
  try{const x=JSON.parse(localStorage.getItem(LEGACY_BACKUPS_KEY)||'[]');return Array.isArray(x)?x.filter(b=>b&&b.data&&Array.isArray(b.data.students)):[];}
  catch(e){return [];}
}
/* 比照舊版的判斷：主資料空白（且不是刻意清空）時，改用備份庫中「目前」或最新的一份 */
function pickLegacyBackup(lsState){
  const list=readLegacyBackups();if(!list.length)return null;
  let activeId='',explicitEmpty=false;
  try{activeId=localStorage.getItem(LEGACY_ACTIVE_KEY)||'';explicitEmpty=localStorage.getItem(LEGACY_EMPTY_KEY)==='1';}catch(_){}
  const ts=b=>Date.parse(b.savedAt||b.importedAt||0)||0;
  const active=list.find(b=>b.id===activeId)||null;
  const newest=active||[...list].sort((a,b)=>ts(b)-ts(a))[0];
  if(!(lsState&&(lsState.students.length>0||explicitEmpty)))return newest;
  if(active&&active.className===lsState.meta.className&&ts(active)>(Date.parse(lsState.meta.updatedAt||0)||0))return active;
  return null;
}
/* 舊版備份庫每一份都轉成「舊版班級備份庫」還原點（不會被自動刪除），原資料保留 */
async function migrateLegacyBackups(){
  if(store.mode!=='idb')return 0;
  let done=null;try{done=await idbGet('kv','legacyBackupsMigrated');}catch(_){}
  if(done)return 0;
  let n=0;
  for(const b of readLegacyBackups()){
    const d=prepareState(b.data);if(!d)continue;
    const id='old-'+String(b.id||n);
    await idbPut('snapshots',id,{id,at:Date.parse(b.savedAt||b.importedAt||0)||Date.now(),reason:`舊版班級備份庫：${b.className||d.meta.className||'未命名班級'}`,data:currentDataOf(d)});
    n++;
  }
  await idbPut('kv','legacyBackupsMigrated',{at:Date.now(),count:n});
  return n;
}
function currentDataOf(d){const c=JSON.parse(JSON.stringify(d));stripSensitive(c);return c;}
const hasLegacyLS=()=>{try{return localStorage.getItem(LEGACY_BACKUPS_KEY)!==null;}catch(e){return false;}};

     <p>這些備份已轉成「舊版班級備份庫」還原點（已去除身分證字號），清除舊版資料不影響目前資料與還原點；但舊版程式就看不到這些備份了。</p>`,'清除','danger'))return;

/* ---------- 資料夾正本（File System Access API，Chrome／Edge） ---------- */
const fsSupported=typeof window.showDirectoryPicker==='function';
const folder={handle:null,name:'',status:fsSupported?'none':'unsupported',known:null,dirty:false,timer:null,writing:null,histCount:0,errMsg:'',warned:false};

async function readMaster(dir){
  try{
    const fh=await dir.getFileHandle(FOLDER_FILE);const file=await fh.getFile();const text=await file.text();
    let obj=null;try{obj=JSON.parse(text);}catch(_){}
    return {exists:true,text,obj,lastModified:file.lastModified};
  }catch(e){if(e&&e.name==='NotFoundError')return {exists:false};throw e;}
}
async function writeFileSafe(dir,name,text){
  const fh=await dir.getFileHandle(name,{create:true});const w=await fh.createWritable();
  try{await w.write(text);await w.close();}catch(e){try{await w.abort();}catch(_){}throw e;}
  return (await fh.getFile()).lastModified;
}
const knownOf=(cur,lm)=>({lastModified:lm??cur.lastModified,rev:cur.obj?.rev??0,savedAt:cur.obj?.savedAt??0,savedBy:cur.obj?.savedBy??''});
function masterChanged(cur){
  if(!cur.exists)return false;
  const k=folder.known;if(!k)return true;
  if(cur.lastModified===k.lastModified)return false;
  return (cur.obj?.rev??0)!==k.rev||(cur.obj?.savedAt??0)!==k.savedAt||(cur.obj?.savedBy??'')!==k.savedBy;
}
async function rememberKnown(k){folder.known=k;try{await idbPut('kv','folderKnown',k);}catch(_){}}
/* 同一台電腦的其他分頁寫過資料夾時，以 IndexedDB 中較新的紀錄為準，避免誤判成「另一台電腦」 */
async function syncKnown(){
  try{const k=await idbGet('kv','folderKnown');
    if(k&&(!folder.known||k.lastModified!==folder.known.lastModified)&&(k.savedAt||0)>=(folder.known?.savedAt||0))folder.known=k;}catch(_){}
}
async function ensureDailyHistory(cur){
  if(!cur.exists)return;
  const hist=await folder.handle.getDirectoryHandle(FOLDER_HIST,{create:true});
  const name=`班級學生資料_${dayStamp()}.json`;
  let has=true;try{await hist.getFileHandle(name);}catch(_){has=false;}
  if(!has)await writeFileSafe(hist,name,cur.text);
  const names=[];
  for await(const [n,h] of hist.entries())if(h.kind==='file'&&FOLDER_HIST_RE.test(n))names.push(n);
  names.sort().reverse();
  for(const n of names.slice(HIST_KEEP))await hist.removeEntry(n);
  folder.histCount=Math.min(names.length,HIST_KEEP);
}
async function countHistory(){
  try{const hist=await folder.handle.getDirectoryHandle(FOLDER_HIST);let n=0;
    for await(const [name,h] of hist.entries())if(h.kind==='file'&&FOLDER_HIST_RE.test(name))n++;folder.histCount=n;}
  catch(_){folder.histCount=0;}
}
const masterPayload=()=>({...currentData(),savedAt:meta.savedAt||Date.now(),rev:meta.rev,savedBy:deviceName(),appVersion:APP_VERSION,app:'lssh-student-data'});
async function writeConflictFile(text,who){
  const name=`班級學生資料_衝突_${safeName(who)}_${minuteStamp()}.json`;
  await writeFileSafe(folder.handle,name,text);return name;
}
async function writeMaster({force=false}={}){
  if(!folder.handle||!['ok','error','paused'].includes(folder.status))return;
  if(folder.status==='paused'&&!force)return;
  if(folder.writing){await folder.writing;return writeMaster({force});}
  folder.writing=(async()=>{
    try{
      await syncKnown();
      const cur=await readMaster(folder.handle);
      if(!force&&masterChanged(cur)){await folderConflict(cur);return;}
      await ensureDailyHistory(cur);
      const payload=masterPayload();
      const lm=await writeFileSafe(folder.handle,FOLDER_FILE,JSON.stringify(payload,null,2));
      await rememberKnown({lastModified:lm,rev:payload.rev,savedAt:payload.savedAt,savedBy:payload.savedBy});
      Object.assign(folder,{dirty:false,status:'ok',errMsg:'',warned:false});
    }catch(e){
      folder.status='error';folder.errMsg=e?.message||String(e);
      if(!folder.warned){toast('📁 寫入資料夾失敗，資料仍保存在這台電腦，下次儲存會自動重試',{type:'warn'});folder.warned=true;}
    }
  })();
  try{await folder.writing;}finally{folder.writing=null;renderFolder();}
}
function scheduleFolderWrite(){
  if(!folder.handle||!['ok','error'].includes(folder.status))return;
  clearTimeout(folder.timer);folder.timer=setTimeout(()=>writeMaster(),2000);renderFolder();
}
async function loadFromMaster(cur,reason){
  const d=prepareState(cur.obj);
  if(!d){toast('資料夾內的資料檔無法讀取',{type:'err'});return false;}
  if(!isEmptyData(currentData()))await makeSnapshot(reason||'載入資料夾資料前');
  applyData(d);dirty=false;
  await commitLocal(currentData(),cur.obj.savedAt||Date.now());
  await rememberKnown(knownOf(cur));folder.dirty=false;renderSaveTag();
  return true;
}
function compareTable(folderData,localData,localSavedAt){
  const row=(label,d,at,by)=>`<tr><td><strong>${label}</strong></td><td>${esc(countsText(d))}</td><td>${esc(fmtTime(at))}${by?'｜'+esc(by):''}</td></tr>`;
  return `<table style="margin-top:8px">${row('資料夾',folderData,folderData?.savedAt,folderData?.savedBy)}${row('這台電腦',localData,localSavedAt,deviceName())}</table>`;
}
async function folderConflict(cur){
  if(conflictOpen)return;
  conflictOpen=true;
  const other=cur.obj||{};
  const choice=await askChoice('資料夾內的資料已被另一台電腦更新',
    `<p>「${esc(other.savedBy||'另一台電腦')}」在 ${esc(fmtTime(other.savedAt))} 更新了資料夾內的資料，本頁也有尚未寫入的修改。</p>${compareTable(other,currentData(),meta.savedAt)}`,
    [{value:'load',label:'載入資料夾內較新的資料',style:'primary'},{value:'overwrite',label:'以本頁內容覆蓋',style:'danger'},{value:'later',label:'本頁另存衝突檔',style:'plain'}]);
  conflictOpen=false;hideBanner();
  try{
    if(choice==='load'){await loadFromMaster(cur,'載入資料夾資料前（本頁未寫入的內容）');folder.status='ok';toast('已載入資料夾內的最新資料；本頁原內容已存成還原點');}
    else if(choice==='overwrite'){const n=await writeConflictFile(cur.text,other.savedBy||'另一台電腦');folder.status='ok';await rememberKnown(knownOf(cur));setTimeout(()=>writeMaster({force:true}),0);toast(`資料夾原檔已另存為 ${n}`);}
    else{const n=await writeConflictFile(JSON.stringify(masterPayload(),null,2),deviceName());folder.status='paused';toast(`本頁內容已另存為 ${n}，資料夾同步暫停`);}
  }catch(e){folder.status='error';folder.errMsg=e?.message||String(e);}
  renderFolder();
}
async function reconcile(dir,firstLink){
  const cur=await readMaster(dir);
  const prevHandle=folder.handle,prevKnown=folder.known;
  folder.handle=dir;folder.name=dir.name;
  if(firstLink)folder.known=null;
  const commit=async()=>{folder.status='ok';try{await idbPut('kv','folderHandle',dir);}catch(_){}await countHistory();};
  if(!cur.exists){
    await commit();await writeMaster({force:true});
    if(folder.status==='ok')toast(`已在資料夾建立「${FOLDER_FILE}」`);
    return true;
  }
  if(!cur.obj||!prepareState(cur.obj)){
    folder.handle=prevHandle;folder.known=prevKnown;
    await askChoice('資料夾內的資料檔無法讀取',`<p>${esc(FOLDER_FILE)} 不是本程式可讀的格式。請檢查檔案，或改選其他資料夾。</p>`,[{value:'ok',label:'知道了',style:'primary'}]);
    return false;
  }
  const localEmpty=isEmptyData(currentData());
  const mChanged=masterChanged(cur);
  const lChanged=!folder.known||meta.savedAt>(folder.known.savedAt||0)||dirty;
  if(!firstLink&&!mChanged){await commit();await rememberKnown(knownOf(cur));if(lChanged)await writeMaster();return true;}
  if(localEmpty||(!firstLink&&!lChanged)){await commit();await loadFromMaster(cur);toast(`已載入資料夾內的資料（${countsText(cur.obj)}）`);return true;}
  const choice=await askChoice(firstLink?'資料夾內已有班級資料':'這台電腦與資料夾的資料不同',
    `<p>${firstLink?'選擇的資料夾中已經有班級學生資料，這台電腦也有資料。':'上次沒連上資料夾時這台電腦改過資料，資料夾內的資料也被更新過。'}請選擇要使用哪一份：</p>
     ${compareTable(cur.obj,currentData(),meta.savedAt)}<p class="hint" style="margin-top:10px">沒被選用的一份不會遺失：本機資料會存成還原點；資料夾資料會另存成衝突檔。</p>`,
    [{value:'folder',label:'使用資料夾內的資料',style:'primary'},{value:'local',label:'用本機資料覆蓋資料夾',style:'danger'},{value:'cancel',label:'取消',style:'plain'}]);
  if(choice==='folder'){await commit();await loadFromMaster(cur,'改用資料夾資料前');toast('已改用資料夾內的資料；本機原資料已存成還原點');return true;}
  if(choice==='local'){await commit();const n=await writeConflictFile(cur.text,cur.obj.savedBy||'資料夾原檔');await rememberKnown(knownOf(cur));await writeMaster({force:true});toast(`已用本機資料覆蓋；資料夾原檔另存為 ${n}`);return true;}
  if(firstLink){folder.handle=prevHandle;folder.known=prevKnown;if(!prevHandle)folder.status='none';}
  else folder.status='paused';
  return false;
}
async function pickFolder(){
  if(!fsSupported)return toast('這個瀏覽器不支援選擇資料夾，請改用電腦版 Chrome 或 Edge',{type:'warn'});
  let dir;
  try{dir=await window.showDirectoryPicker({id:'lssh-student-data',mode:'readwrite'});}
  catch(e){if(e?.name!=='AbortError')toast('無法開啟資料夾：'+(e?.message||e),{type:'err'});return;}
  try{
    if(dir.queryPermission&&(await dir.queryPermission({mode:'readwrite'}))!=='granted'){
      if((await dir.requestPermission({mode:'readwrite'}))!=='granted')return toast('沒有取得資料夾寫入權限',{type:'warn'});
    }
    await flushSave();await reconcile(dir,true);
  }catch(e){toast('連結資料夾失敗：'+(e?.message||e),{type:'err'});}
  hideBanner();renderFolder();
}
async function disconnectFolder(){
  if(!await confirmBox('中斷資料夾連結？','<p>資料夾內的檔案不會被刪除，這台電腦的資料也會保留；之後只存在這台電腦的瀏覽器。</p>','中斷連結','danger'))return;
  clearTimeout(folder.timer);
  try{await idbDel('kv','folderHandle');await idbDel('kv','folderKnown');}catch(_){}
  Object.assign(folder,{handle:null,name:'',status:'none',known:null,dirty:false,errMsg:'',histCount:0});
  hideBanner();renderFolder();toast('已中斷資料夾連結');
}
async function grantFolder(){
  if(!folder.handle)return;
  try{
    if((await folder.handle.requestPermission({mode:'readwrite'}))!=='granted')return toast('沒有取得資料夾權限，目前仍使用本機資料',{type:'warn'});
    await flushSave();await reconcile(folder.handle,false);hideBanner();
  }catch(e){folder.status='error';folder.errMsg=e?.message||String(e);toast('無法讀取資料夾，目前仍使用本機資料',{type:'warn'});}
  renderFolder();
}
async function reloadFromFolder(){
  if(!folder.handle)return;
  try{
    const cur=await readMaster(folder.handle);
    if(!cur.exists)return toast('資料夾內還沒有資料檔');
    await loadFromMaster(cur,'從資料夾重新載入前');folder.status='ok';hideBanner();toast('✓ 已從資料夾重新載入');
  }catch(e){folder.status='error';folder.errMsg=e?.message||String(e);toast('讀取資料夾失敗',{type:'err'});}
  renderFolder();
}
async function initFolder(){
  if(!fsSupported||store.mode!=='idb'){renderFolder();return;}
  let dir=null;
  try{dir=await idbGet('kv','folderHandle');folder.known=(await idbGet('kv','folderKnown'))||null;}catch(_){}
  if(!dir){renderFolder();return;}
  folder.handle=dir;folder.name=dir.name;
  let perm='prompt';try{perm=await dir.queryPermission({mode:'readwrite'});}catch(_){}
  if(perm==='granted'){
    try{await reconcile(dir,false);}
    catch(e){
      folder.status='error';folder.errMsg=e?.message||String(e);
      showBanner(`⚠ 無法讀取資料夾「${esc(folder.name)}」（可能已被移動、刪除，或雲端硬碟尚未啟動），目前使用這台電腦的資料。`,[{label:'重試',fn:grantFolder},{label:'更換資料夾',fn:pickFolder}]);
    }
  }else{
    folder.status='needPermission';
    showBanner(`📁 請按「連接資料夾」使用「${esc(folder.name)}」內的資料——授權前畫面顯示的是這台電腦的資料，可能不是最新。`,[{label:'連接資料夾',fn:grantFolder}]);
  }
  renderFolder();
}
let checkingFolder=false;
async function checkFolderUpdate(){
  if(checkingFolder||folder.status!=='ok'||!folder.handle||folder.writing||conflictOpen)return;
  checkingFolder=true;
  try{
    await syncKnown();
    const cur=await readMaster(folder.handle);
    if(!masterChanged(cur))return;
    if(dirty||folder.dirty){await folderConflict(cur);return;}
    showBanner(`🔄 另一台電腦（${esc(cur.obj?.savedBy||'另一台電腦')}）已於 ${esc(fmtTime(cur.obj?.savedAt))} 更新班級資料。`,[{label:'載入最新資料',fn:reloadFromFolder}]);
  }catch(e){folder.status='error';folder.errMsg=e?.message||String(e);renderFolder();}
  finally{checkingFolder=false;}
}

/* 對話框可以疊放（例如資料夾衝突時又跳出提示），每個一層 */
function dlgLayer(html){const root=$('#dialogRoot');const layer=document.createElement('div');layer.className='dlg-bg';layer.innerHTML=html;root.appendChild(layer);return layer;}
function askChoice(title,bodyHtml,choices){
  return new Promise(resolve=>{
    const cls={primary:'btn pri',danger:'btn danger-solid',plain:'btn'};
    const layer=dlgLayer(`<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h3>${esc(title)}</h3><div class="mbody">${bodyHtml}</div>
      <div class="mfoot dlg-btns">${choices.map((c,i)=>`<button type="button" class="${cls[c.style]||'btn'}" data-i="${i}">${esc(c.label)}</button>`).join('')}</div></div>`);
    layer.querySelectorAll('[data-i]').forEach(b=>b.addEventListener('click',()=>{layer.remove();resolve(choices[+b.dataset.i].value);}));
    const btns=layer.querySelectorAll('[data-i]');const focus=btns[btns.length-1];if(focus)focus.focus();
  });
}
/* 表單對話框：fields=[{key,label,value,type:'text'|'select'|'textarea',options,placeholder,required,validate,hint}]
   回傳 {key:值} 或 null（取消）；extra 按鈕回傳 {__action:value} */
function askForm(title,fields,{okLabel='確定',intro='',extra=[]}={}){
  return new Promise(resolve=>{
    const inp=f=>f.type==='select'?`<select id="af_${f.key}">${f.options.map(o=>`<option value="${esc(o)}" ${o===(f.value||'')?'selected':''}>${esc(o||'—')}</option>`).join('')}</select>`
      :f.type==='textarea'?`<textarea id="af_${f.key}" rows="${f.rows||3}" style="width:100%;line-height:1.7" placeholder="${esc(f.placeholder||'')}">${esc(f.value||'')}</textarea>`
      :`<input id="af_${f.key}" type="text" autocomplete="off" value="${esc(f.value||'')}" placeholder="${esc(f.placeholder||'')}">`;
    const layer=dlgLayer(`<form class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}" novalidate><h3>${esc(title)}</h3><div class="mbody">${intro}
      ${fields.map(f=>`<div class="fld" style="margin-bottom:12px"><label for="af_${f.key}">${esc(f.label)}${f.required?' <span style="color:var(--danger)">*</span>':''}</label>${inp(f)}${f.hint?`<div class="hint">${f.hint}</div>`:''}</div>`).join('')}
      <div class="hint" data-err style="color:var(--danger);font-size:12.5px"></div></div>
      <div class="mfoot dlg-btns">${extra.map((e,i)=>`<button type="button" class="btn ${e.style==='danger'?'danger':''}" data-x="${i}" style="margin-right:auto">${esc(e.label)}</button>`).join('')}
        <button type="button" class="btn" data-cancel>取消</button><button type="submit" class="btn pri">${esc(okLabel)}</button></div></form>`);
    const close=v=>{layer.remove();resolve(v);};
    const el=k=>layer.querySelector('#af_'+k);
    layer.querySelector('form').addEventListener('submit',e=>{
      e.preventDefault();
      const v=Object.fromEntries(fields.map(f=>[f.key,String(el(f.key).value||'').trim()]));
      for(const f of fields){
        const err=(f.required&&!v[f.key])?`請填寫「${f.label}」`:(f.validate?f.validate(v[f.key],v):'');
        if(err){layer.querySelector('[data-err]').textContent=err;el(f.key).focus();return;}
      }
      close(v);
    });
    layer.querySelector('[data-cancel]').onclick=()=>close(null);
    layer.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>close({__action:extra[+b.dataset.x].value}));
    layer.addEventListener('keydown',e=>{if(e.key==='Escape'){e.stopPropagation();close(null);}});
    const first=layer.querySelector('input,select,textarea');if(first){first.focus();if(first.select)first.select();}
  });
}
async function askText(title,label,value='',opts={}){const r=await askForm(title,[{key:'v',label,value,required:true,...opts}],opts);return r?r.v:null;}

let _undo=null;
function undoable(msg,fn){
  const before=JSON.stringify(state);
  fn();save();render();
  if(_undo)clearTimeout(_undo.timer);
  const bar=$('#undoBar');
  bar.innerHTML=`<span>${esc(msg)}</span><button type="button" class="btn sm" onclick="doUndo()">↶ 復原</button>`;
  bar.classList.add('show');

  if(d){applyData(d);save();toast('↶ 已復原');}
}
