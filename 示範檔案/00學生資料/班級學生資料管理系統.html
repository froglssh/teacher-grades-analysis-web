function renderFolder(){
  const tag=$('#folderTag'),hint=$('#sideStoreHint');
  if(WS){tag.className='stag hidden';if(hint)hint.textContent='資料存在工作站共用資料庫';return;}
  const map={ok:['📁 已同步到資料夾','ok'],needPermission:['📁 需要重新授權','warn'],error:['📁 寫入失敗','err'],paused:['📁 同步暫停','warn']};
  if(map[folder.status]){
    const pending=folder.status==='ok'&&(folder.dirty||folder.writing);
    tag.textContent=pending?'📁 等待寫入資料夾…':map[folder.status][0];tag.className='stag '+map[folder.status][1];
  }else if(folder.status==='none'){tag.textContent='📁 未連結資料夾';tag.className='stag warn';}
  else tag.className='stag hidden';
  if(hint)hint.textContent=folder.status==='ok'?`已同步：${folder.name}`:folder.status==='needPermission'?'資料夾需要重新授權':folder.status==='error'?'資料夾寫入失敗，請查看':folder.status==='paused'?'資料夾同步暫停':'只存在這台電腦，建議選資料夾';

  const box=$('#folderBox');if(!box)return;
  if(folder.status==='unsupported'){
    box.innerHTML=`<div class="note" style="margin:0">這個瀏覽器不支援「選擇資料夾」（只有電腦版 Chrome、Edge 支援）。資料目前存在這台電腦的瀏覽器中（IndexedDB），其他功能照常；請定期下載 JSON 備份。</div>`;
  }else if(store.mode!=='idb'){
    box.innerHTML=`<div class="note" style="margin:0">這個瀏覽器目前無法使用 IndexedDB（可能是無痕視窗或停用了網站資料），無法記住資料夾。請定期下載 JSON 備份。</div>`;
  }else if(!folder.handle||folder.status==='none'){
    box.innerHTML=`<p style="margin:0">目前資料<strong>只存在這台電腦的瀏覽器</strong>（IndexedDB）。清除瀏覽器資料或換電腦就看不到了。</p>
      <p class="hint">建議選擇 Google 雲端硬碟裡的一個資料夾作為長期存放位置；學校、家裡兩台電腦選同一個資料夾，就能共用同一份班級資料。<br>寫入資料夾的檔案<strong>不含身分證字號與 AI 金鑰</strong>。</p>
      <div class="btnrow"><button class="btn pri" onclick="pickFolder()">📁 選擇資料存放資料夾</button></div>`;
  }else{
    const k=folder.known;
    const statusText={ok:'✅ 已同步',needPermission:'⏸ 需要授權',error:'⚠ 讀寫失敗：'+esc(folder.errMsg||''),paused:'⏸ 同步暫停（請重新載入或立即寫入）'}[folder.status]||'';
    box.innerHTML=`<div class="info-grid">
        <div>資料夾：<strong>${esc(folder.name)}</strong></div><div>狀態：${statusText}</div>
        <div>資料檔：<code>${esc(FOLDER_FILE)}</code></div><div>最後寫入：${esc(fmtTime(k?.savedAt))}${k?.savedBy?'｜'+esc(k.savedBy):''}</div>
        <div>每日備份：<code>${esc(FOLDER_HIST)}/</code>${folder.histCount} 份（最多 ${HIST_KEEP}）</div><div>這台電腦：${esc(deviceName())}</div></div>
      <div class="btnrow">
        ${folder.status==='needPermission'?'<button class="btn pri" onclick="grantFolder()">連接資料夾</button>':''}
        <button class="btn" onclick="writeFolderNow()">立即寫入</button>
        <button class="btn" onclick="askReloadFromFolder()">從資料夾重新載入</button>
        <button class="btn" onclick="pickFolder()">更換資料夾</button>
        <button class="btn danger" onclick="disconnectFolder()">中斷連結</button></div>`;
  }
}
async function writeFolderNow(){
  if(folder.status==='needPermission')return grantFolder();
  await flushSave();
  const force=folder.status==='paused';
  if(force){
    if(!await confirmBox('以本頁內容覆蓋資料夾？','<p>資料夾內的原檔會先另存成衝突檔。</p>','覆蓋','danger'))return;
    try{const cur=await readMaster(folder.handle);if(cur.exists)await writeConflictFile(cur.text,cur.obj?.savedBy||'資料夾原檔');}catch(_){}
  }
  await writeMaster({force});
  if(folder.status==='ok')toast('✓ 已寫入資料夾');
}
async function askReloadFromFolder(){
  if(folder.status==='needPermission')return grantFolder();
  if(await confirmBox('從資料夾重新載入？','<p>會用資料夾內的資料取代目前畫面；目前資料會先存成還原點。</p>','重新載入'))reloadFromFolder();
}
async function renderStorageInfo(){
  const box=$('#storageInfo');if(!box)return;
  let size=0;try{size=new Blob([JSON.stringify(currentData())]).size;}catch(_){}
  let quota='';
  try{if(navigator.storage?.estimate){const e=await navigator.storage.estimate();quota=`${(e.usage/1048576).toFixed(1)} MB／${(e.quota/1048576).toFixed(0)} MB`;}}catch(_){}
  box.innerHTML=`
    <div>本機儲存：${store.mode==='idb'?'IndexedDB（主要）':'<strong style="color:var(--warn)">localStorage（後援模式）</strong>'}</div>
    <div>localStorage 鏡像：${store.mirrorOk?'正常':'<span style="color:var(--warn)">已停止（資料過大，不影響 IndexedDB）</span>'}</div>
    <div>班級資料大小：${(size/1024).toFixed(1)} KB</div>
    <div>瀏覽器配額：${quota||'無法取得'}</div>
    <div>持久儲存：${store.persisted===true?'已取得（瀏覽器不會自動清除）':store.persisted===false?'未取得（空間不足時可能被清除）':'不支援'}</div>
    <div>最後儲存：${esc(fmtTime(store.lastSavedAt||meta.savedAt))}</div>
    <div>程式版本：v${APP_VERSION}</div>
    <div>身分證字號：不儲存、不匯入、不寫入資料夾</div>`;
  const lb=$('#legacyBox');
  if(lb)lb.innerHTML=(hasLegacyLS()&&store.mode==='idb')?`<div class="note" style="margin-top:12px">這台電腦還留有舊版（v2）的「班級備份庫」資料（localStorage），內容已轉成「舊版班級備份庫」還原點。舊資料可能含身分證字號，確認還原點沒問題後可以清除。
      <div class="btnrow"><button class="btn sm danger" onclick="clearLegacy()">清除舊版瀏覽器備份</button></div></div>`:'';
}
function openStoragePanel(){
  if(WS){
    $('#modalRoot').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:620px">
      <h3>🔗 資料存放（共享整合版）<span class="x" onclick="closeModal()">×</span></h3>
      <div class="mbody">
        <div class="store-sec"><h4>🔗 工作站共用資料庫</h4><p style="margin:0">這個頁面是在「班級經營整合工作站」中開啟：學生名冊與本班本學期的學生資料，都存在工作站的共用資料庫，和幹部、座位、打掃、評語等工具共用同一份名冊。</p>
          <p class="hint">長期保存（選雲端硬碟資料夾）、完整備份與還原，請到<b>工作站首頁 →「資料保存」</b>與<b>資料中心</b>設定；學生資料會一併保存。</p></div>
        <div class="store-sec"><h4>🧩 只下載這個工具的資料</h4><p class="hint" style="margin:0">下載整班學生資料 JSON（不含 AI 金鑰、身分證字號），可在獨立版匯入。</p>
          <div class="btnrow"><button class="btn pri" onclick="downloadJSON()">⬇ 下載整班學生資料 JSON</button></div></div>
      </div><div class="mfoot"><button class="btn" onclick="closeModal()">關閉</button></div></div></div>`;
    return;
  }
  $('#modalRoot').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:820px">
    <h3>📁 資料存放與還原<span class="x" onclick="closeModal()">×</span></h3>
    <div class="mbody">
      <div class="store-sec"><h4>📁 長期存放資料夾</h4><div id="folderBox"></div></div>
      <div class="store-sec"><h4>⏪ 自動還原點<span class="hint">每天 1 份（留 ${DAILY_SNAP_KEEP} 天）＋重要動作前 1 份（留 ${EVENT_SNAP_KEEP} 份）</span></h4><div id="snapshotList"><p class="hint">讀取中…</p></div></div>
      <div class="store-sec"><h4>🧩 JSON 備份檔</h4>
        <p class="hint" style="margin:0">下載整班完整備份（不含 AI 金鑰、身分證字號），可帶到其他電腦或另外保存。匯入整班備份前會自動留一份還原點。</p>
        <div class="btnrow"><button class="btn pri" onclick="downloadJSON()">⬇ 下載整班備份 JSON</button><button class="btn" onclick="pickImport('json')">⬆ 匯入整班備份 JSON</button></div></div>
      <div class="store-sec"><h4>ℹ️ 儲存狀態</h4><div id="storageInfo" class="info-grid"></div><div id="legacyBox"></div></div>
    </div>
    <div class="mfoot"><button class="btn" onclick="closeModal()">關閉</button></div>
  </div></div>`;
  renderFolder();renderSnapshots();renderStorageInfo();
}
function downloadJSON(base){
  const data={...currentData(),savedAt:meta.savedAt,rev:meta.rev,savedBy:deviceName(),appVersion:APP_VERSION,app:'lssh-student-data',exportedAt:new Date().toISOString()};
  download(new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'}),(base||safeName(`班級學生資料備份_${state.meta.className||'未命名'}`))+`_${minuteStamp()}.json`);
  toast('✓ 已下載整班備份 JSON');
}
function exportClassJSON(){downloadJSON();}

/* ---------- 啟動 ---------- */
/* 共享整合版：資料來自工作站（bridge.js 已先載入本班本學期的工具資料） */
function bootWorkspace(){
  store.mode='ws';
  let d=null;try{const raw=workspaceStorage.getItem(LS_KEY);if(raw)d=prepareState(JSON.parse(raw));}catch(e){console.warn(e);}
  if(d)state=d;
  for(const st of state.students)ensureStudentShape(st);
  booted=true;
  document.body.classList.add('ws-mode');
  render();
  const ov=$('#bootOverlay');if(ov)ov.remove();
  renderSaveTag();renderFolder();
}
async function boot(){
  if(WS)return bootWorkspace();
  let idbData=null,lsData=null;
  try{await idbOpen();idbData=await idbGet('kv','state');store.mode='idb';}
  catch(e){store.mode='ls';console.warn('IndexedDB 不可用，改用 localStorage',e);}
  try{const raw=localStorage.getItem(LS_KEY);if(raw)lsData=JSON.parse(raw);}catch(_){}
  const tsOf=r=>r?(Number(r.savedAt)||Date.parse((r.meta&&r.meta.updatedAt)||0)||0):0;
  const nI=prepareState(idbData),nL=prepareState(lsData);
  let chosen=null,from='',chosenAt=0;
  if(nI&&nL){if(tsOf(lsData)>tsOf(idbData)){chosen=nL;from='ls';chosenAt=tsOf(lsData);}else{chosen=nI;from='idb';chosenAt=tsOf(idbData);}}
  else if(nI){chosen=nI;from='idb';chosenAt=tsOf(idbData);}
  else if(nL){chosen=nL;from='ls';chosenAt=tsOf(lsData);}
  if(!nI){ // 第一次使用 v3.0：比照舊版，名冊空白時改用舊版備份庫中的班級
    const lb=pickLegacyBackup(nL);const d=lb&&prepareState(lb.data);
    if(d){chosen=d;from='legacy';chosenAt=Date.parse(lb.savedAt||lb.importedAt||0)||Date.now();}
  }
  meta.rev=Math.max((idbData&&idbData.rev)||0,(lsData&&lsData.rev)||0);
  if(chosen){state=chosen;meta.savedAt=chosenAt;}
  for(const st of state.students)ensureStudentShape(st);
  booted=true;
  let moved=0;try{moved=await migrateLegacyBackups();}catch(e){console.warn('舊版備份庫轉換失敗',e);}
  // 舊版只存在 localStorage 的資料 → 搬進 IndexedDB，讀回比對一致才採用（原資料保留）
  if(store.mode==='idb'&&from&&from!=='idb'){
    try{
      const before=countsText(currentData());
      await commitLocal(currentData(),chosenAt||Date.now());
      const back=prepareState(await idbGet('kv','state'));
      if(back&&countsText(back)===before){if(!idbData)toast('✓ 已將舊版資料搬到 IndexedDB'+(moved?`；舊版備份庫 ${moved} 份已轉成還原點`:'')+'（原資料仍保留）');}
      else{toast('⚠ 搬移到 IndexedDB 後比對不一致，暫用 localStorage',{type:'warn'});store.mode='ls';}
    }catch(e){store.mode='ls';}
  }
  try{if(navigator.storage&&navigator.storage.persist)store.persisted=await navigator.storage.persist();}catch(_){}
  render();
  const ov=$('#bootOverlay');if(ov)ov.remove();
  renderSaveTag();
  await initFolder();
}

boot();
</script>
