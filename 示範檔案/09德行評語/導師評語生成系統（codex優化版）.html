<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>導師評語生成系統（codex優化版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --ink:#1f2933; --ink-2:#3e4c59; --muted:#6b7785; --line:#dfe3e8; --line-2:#c9d0d8;
  --paper:#f5f3ee; --card:#ffffff; --soft:#f8f9fb;
  --brand:#0f6e66; --brand-2:#0b5751; --brand-bg:#e6f3f1;
  --gold:#a86b00; --gold-bg:#fff6e0;
  --blue:#2f5b9a; --blue-bg:#eaf1fb;
  --slate-bg:#eef1f5; --slate:#4f5d6e;
  --ok:#1f7a45; --ok-bg:#e8f5ec; --warn:#9a5b00; --warn-bg:#fff4dc; --bad:#b42318; --bad-bg:#fdecea;
  --r:12px; --r-sm:8px; --shadow:0 1px 2px rgba(16,24,40,.06),0 2px 8px rgba(16,24,40,.05);
  --top:60px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{overflow-x:hidden}
body{font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.65}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #7cc4bb;outline-offset:1px}
.hidden{display:none!important}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;height:var(--top);background:#1f2933;color:#fff;display:flex;align-items:center;gap:12px;padding:0 16px}
.brand{display:flex;flex-direction:column;line-height:1.2;min-width:0;flex-shrink:1}
.brand b{font-family:'Noto Serif TC',serif;font-size:1.05rem;letter-spacing:1px;white-space:nowrap}
.brand small{font-size:.72rem;color:#aab4bf;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wb-select{background:#2c3a47;border:1px solid #435363;color:#fff;border-radius:8px;padding:6px 8px;max-width:260px;font-size:.85rem}
.progress-pill{display:flex;align-items:center;gap:8px;font-size:.82rem;color:#d7dee5;white-space:nowrap}
.progress-pill .bar{width:90px;height:6px;border-radius:9px;background:#3a4856;overflow:hidden}
.progress-pill .bar i{display:block;height:100%;background:#4cc0a8;width:0}
.top-actions{margin-left:auto;display:flex;gap:6px;align-items:center}
.tbtn{background:transparent;border:1px solid #435363;color:#e6ebf0;border-radius:8px;padding:6px 10px;font-size:.84rem;white-space:nowrap}
.tbtn:hover{background:#2c3a47}
.tbtn.primary{background:var(--brand);border-color:var(--brand)}
.tbtn.primary:hover{background:var(--brand-2)}
.save-state{font-size:.75rem;color:#9fb0bf;white-space:nowrap}
.only-narrow{display:none}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:270px minmax(0,1fr) 440px;gap:0;min-height:calc(100vh - var(--top))}
.roster{border-right:1px solid var(--line);background:#fbfaf7;position:sticky;top:var(--top);height:calc(100vh - var(--top));display:flex;flex-direction:column}
.editor{padding:18px 20px 90px;min-width:0}
.preview{border-left:1px solid var(--line);background:#fbfaf7;position:sticky;top:var(--top);height:calc(100vh - var(--top));overflow:auto;padding:16px 16px 40px}

/* ---------- roster ---------- */
.roster-head{padding:12px 12px 8px;border-bottom:1px solid var(--line)}
.roster-head h2{font-size:.95rem;display:flex;justify-content:space-between;align-items:center}
.roster-tools{display:flex;gap:6px;margin-top:8px}
.roster-tools input{flex:1;min-width:0;border:1px solid var(--line-2);border-radius:8px;padding:6px 8px;background:#fff;font-size:.85rem}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;padding:5px 9px;font-size:.8rem;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.roster-list{list-style:none;overflow:auto;flex:1;padding:6px}
.roster-list li button{width:100%;display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:6px;border:1px solid transparent;background:transparent;border-radius:8px;padding:7px 8px;text-align:left}
.roster-list li button:hover{background:#f0eee8}
.roster-list li button[aria-current="true"]{background:#fff;border-color:var(--brand);box-shadow:var(--shadow)}
.seat{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.82rem}
.rname{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;background:#d0d5dc;display:inline-block}
.dot.draft{background:#e7b33d}.dot.done{background:#2e9d62}.dot.issue{background:#d6584a}
.rmeta{font-size:.72rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.roster-foot{padding:10px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:6px}

/* ---------- common ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-2);background:#fff;border-radius:var(--r-sm);padding:7px 12px;font-size:.86rem;font-weight:500;min-height:36px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-2)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--brand)}
.btn.danger{color:var(--bad);border-color:#efc2bd}
.btn.sm{min-height:30px;padding:4px 9px;font-size:.8rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card h3{font-size:1rem;margin-bottom:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hint{font-size:.8rem;color:var(--muted);font-weight:400}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.flabel{font-size:.8rem;font-weight:700;color:var(--ink-2)}
.in{border:1px solid var(--line-2);border-radius:var(--r-sm);padding:8px 10px;background:#fff;width:100%;min-width:0}
textarea.in{resize:vertical;line-height:1.7}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:5px 11px;font-size:.84rem;line-height:1.4;min-height:32px}
.chip:hover{border-color:var(--brand)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.chip.neg[aria-pressed="true"]{background:var(--slate);border-color:var(--slate)}
.chip small{opacity:.7;font-variant-numeric:tabular-nums;margin-right:3px}
.tag{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 6px 4px 11px;font-size:.82rem;background:var(--brand-bg);color:var(--brand-2);border:1px solid #bfe0da}
.tag.neg{background:var(--slate-bg);color:var(--slate);border-color:#d3d9e1}
.tag.gold{background:var(--gold-bg);color:#7a4f00;border-color:#f0dca8}
.tag button{border:0;background:transparent;font-size:1rem;line-height:1;color:inherit;opacity:.6;padding:0 4px}
.tag button:hover{opacity:1}
.tag .ord{font-weight:700;font-size:.72rem;background:rgba(0,0,0,.08);border-radius:999px;padding:0 6px}

/* ---------- student head ---------- */
.stu-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.stu-head .navs{margin-left:auto}
.stu-head .navs{display:flex;gap:6px}
.stu-fields{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.stu-fields .seat-f{width:70px}.stu-fields .name-f{flex:1 1 130px}.stu-fields .nick-f{flex:1 1 130px}
.seg button{white-space:nowrap}
.stu-fields .in{padding:7px 9px}
.stu-title{font-family:'Noto Serif TC',serif;font-size:1.3rem;font-weight:900}
.status-badge{font-size:.75rem;border-radius:999px;padding:2px 9px;background:var(--slate-bg);color:var(--slate);font-weight:700}
.status-badge.done{background:var(--ok-bg);color:var(--ok)}
.status-badge.draft{background:var(--warn-bg);color:var(--warn)}

/* ---------- steps ---------- */
.steps{display:flex;gap:6px;margin:6px 0 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.steps button{border:0;background:transparent;padding:9px 14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;display:flex;gap:8px;align-items:center}
.steps button .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#e4e7eb;color:var(--ink-2);font-size:.78rem}
.steps button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand)}
.steps button[aria-selected="true"] .n{background:var(--brand);color:#fff}
.step-panel{display:none}.step-panel.active{display:block}
.step-nav{display:flex;justify-content:space-between;margin-top:6px}

/* ---------- codes ---------- */
.code-search{display:flex;gap:8px;margin:10px 0}
.code-cats{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.code-cats button{border:1px solid var(--line);background:var(--soft);border-radius:6px;padding:3px 9px;font-size:.8rem;color:var(--ink-2)}
.code-cats button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.code-grid{display:flex;flex-wrap:wrap;gap:6px;max-height:210px;overflow:auto;padding:4px;border:1px dashed var(--line);border-radius:8px;background:var(--soft)}
.sel-codes{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;min-height:32px;align-items:center}
.count-badge{font-size:.75rem;border-radius:999px;padding:1px 8px;background:var(--slate-bg);color:var(--slate)}
.count-badge.over{background:var(--warn-bg);color:var(--warn)}

/* ---------- traits ---------- */
.trait-cat{margin-top:12px}
.trait-cat h4{font-size:.85rem;color:var(--ink-2);margin-bottom:6px}
.trait-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px}
.trait{display:flex;align-items:center;justify-content:space-between;gap:6px;border:1px solid var(--line);border-radius:8px;padding:5px 6px 5px 10px;background:#fff}
.trait span{font-size:.86rem}
.trait .tb{display:flex;gap:3px}
.trait .tb button{border:1px solid var(--line-2);background:#fff;border-radius:6px;padding:2px 7px;font-size:.76rem;min-height:28px}
.trait .tb button.p[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.trait .tb button.n[aria-pressed="true"]{background:var(--slate);border-color:var(--slate);color:#fff}

/* ---------- lists ---------- */
.item-list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.item{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff}
.item .desc{font-size:.78rem;color:var(--muted)}
.item select{border:1px solid var(--line-2);border-radius:6px;padding:3px 6px;font-size:.8rem;background:#fff}
.add-row{display:grid;grid-template-columns:1.6fr 1fr auto;gap:6px;margin-top:8px}
.add-row.acts{grid-template-columns:120px 90px 1.6fr 1fr auto}
.role-tabs{display:flex;gap:4px;margin:8px 0 6px}
.quick{display:flex;flex-wrap:wrap;gap:5px;max-height:110px;overflow:auto}
.quick button{border:1px dashed var(--line-2);background:#fff;border-radius:6px;padding:3px 8px;font-size:.8rem}
.quick button:hover{border-color:var(--brand);color:var(--brand)}
details.self{border:1px solid var(--line);border-radius:8px;background:var(--soft);padding:8px 12px;margin-top:10px}
details.self summary{cursor:pointer;font-weight:700;font-size:.88rem}
.self-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.self-grid .field label{display:flex;justify-content:space-between;align-items:center}

/* ---------- preview ---------- */
.pv-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.pv-head h2{font-size:1rem}
.pv-opts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.pv-opts select{border:1px solid var(--line-2);border-radius:8px;padding:4px 6px;font-size:.82rem;background:#fff}
.final{min-height:230px;font-size:.98rem;line-height:1.9;font-family:'Noto Serif TC','Noto Sans TC',serif}
.lenbar{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted);margin:6px 0}
.lenbar .track{flex:1;height:6px;border-radius:9px;background:#e4e7eb;position:relative;overflow:hidden}
.lenbar .track i{position:absolute;top:0;bottom:0;left:0;background:#4cc0a8;width:0}
.lenbar .track i.warn{background:#e7b33d}
.notice{border-radius:8px;padding:8px 10px;font-size:.82rem;margin:8px 0;display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.notice.info{background:var(--blue-bg);color:#24467a}
.notice.warn{background:var(--warn-bg);color:#6e4100}
.notice.bad{background:var(--bad-bg);color:#8a1c12}
.checklist{list-style:none;display:flex;flex-direction:column;gap:4px;margin-top:6px}
.checklist li{display:grid;grid-template-columns:20px 1fr;gap:6px;font-size:.84rem;align-items:start}
.checklist .ic{font-weight:900}
.checklist .ok .ic{color:var(--ok)}.checklist .warn .ic{color:var(--warn)}
.checklist .d{display:block;color:var(--muted);font-size:.78rem}
.score{font-size:.8rem;font-weight:700;border-radius:999px;padding:1px 9px;background:var(--ok-bg);color:var(--ok)}
.score.mid{background:var(--warn-bg);color:var(--warn)}
.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.btn-grid .wide{grid-column:1/-1}
.ref{font-size:.82rem;color:var(--ink-2);background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px 10px;white-space:pre-wrap;max-height:120px;overflow:auto}

/* ---------- empty ---------- */
.empty-state{max-width:640px;margin:40px auto;text-align:center}
.empty-state h2{font-family:'Noto Serif TC',serif;font-size:1.5rem;margin-bottom:8px}
.empty-state p{color:var(--muted);margin-bottom:18px}
.empty-state .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:left}
.empty-state .opt{border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.empty-state .opt b{display:block;margin-bottom:4px}
.empty-state .opt span{font-size:.82rem;color:var(--muted)}

/* ---------- modal ---------- */
.modal-wrap{position:fixed;inset:0;background:rgba(15,23,32,.45);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.modal{background:#fff;border-radius:14px;width:min(860px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column;max-height:calc(100vh - 80px)}
.modal.wide{width:min(1180px,100%)}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-h h2{font-size:1.1rem}
.modal-b{padding:16px 18px;overflow:auto}
.modal-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.x{border:0;background:transparent;font-size:1.5rem;line-height:1;color:var(--muted);padding:0 6px}
.sec{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.sec h3{font-size:.95rem;margin-bottom:6px}
table.tbl{width:100%;border-collapse:collapse;font-size:.84rem}
table.tbl th,table.tbl td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.tbl th{background:var(--soft);position:sticky;top:0;font-size:.78rem;color:var(--ink-2)}
table.tbl tr.clickable:hover td{background:#f6faf9;cursor:pointer}
table.tbl select{border:1px solid var(--line-2);border-radius:6px;padding:3px 4px;font-size:.8rem;max-width:210px;background:#fff}
.tbl-wrap{max-height:52vh;overflow:auto;border:1px solid var(--line);border-radius:8px}
.lock{color:var(--bad);font-size:.75rem}
.snippet{color:var(--muted);max-width:420px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.kbd{font-family:ui-monospace,Menlo,monospace;font-size:.75rem;background:var(--soft);border:1px solid var(--line);border-radius:4px;padding:0 4px}

/* ---------- toast ---------- */
#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:#1f2933;color:#fff;border-radius:10px;padding:9px 14px;font-size:.88rem;box-shadow:0 6px 20px rgba(0,0,0,.2);display:flex;gap:12px;align-items:center}
.toast button{background:transparent;border:1px solid #6b7785;color:#9fe3d4;border-radius:6px;padding:2px 9px}
.spinner{width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;display:inline-block;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.credit{font-size:.75rem;color:var(--muted);margin-top:24px;text-align:center}
.credit a{color:var(--brand)}

/* ---------- responsive ---------- */
@media (max-width:1280px){
  .layout{grid-template-columns:240px minmax(0,1fr) 380px}
}
@media (max-width:1180px){.brand small,.progress-pill .bar{display:none}}
@media (max-width:1080px){
  .layout{grid-template-columns:minmax(0,1fr) 380px}
  .roster{position:fixed;left:0;top:var(--top);bottom:0;width:290px;z-index:60;transform:translateX(-100%);transition:transform .2s;box-shadow:4px 0 20px rgba(0,0,0,.15);height:auto}
  .roster.open{transform:none}
  .only-narrow{display:inline-flex}
  .scrim{position:fixed;inset:var(--top) 0 0 0;background:rgba(0,0,0,.25);z-index:55}
}
@media (max-width:820px){
  body{font-size:15px}
  .layout{grid-template-columns:minmax(0,1fr)}
  .preview{position:static;height:auto;border-left:0;border-top:1px solid var(--line);padding:16px}
  .editor{padding:14px 16px 24px}
  .brand,.progress-pill .bar,.save-state,.hide-sm{display:none}
  .topbar{gap:6px;padding:0 10px}
  .progress-pill{font-size:.75rem}
  .top-actions{gap:4px}
  .top-actions .tbtn,.tbtn{padding:5px 7px;font-size:.8rem}
  .stu-fields .name-f,.stu-fields .nick-f{flex:1 1 40%}
  .grid2,.grid3,.self-grid{grid-template-columns:1fr}
  .add-row,.add-row.acts{grid-template-columns:1fr 1fr}
  .add-row .btn{grid-column:1/-1}
  .empty-state .opts{grid-template-columns:1fr}
  .mobile-bar{position:sticky;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);display:flex;gap:6px;padding:8px 12px}
  .mobile-bar .btn{flex:1}
  .modal-wrap{padding:0}
  .modal{max-height:100vh;border-radius:0;min-height:100vh}
}
@media (min-width:821px){.mobile-bar{display:none}}
@media print{
  .topbar,.roster,.editor,.mobile-bar,#toasts{display:none!important}
}
</style>
</head>
<body>
<header class="topbar">
  <button class="tbtn only-narrow" id="btnRoster" aria-label="開啟名單">☰ 名單</button>
  <div class="brand"><b>導師評語生成系統</b><small>codex優化版｜德行評語 × 日常生活表現 × 特殊表現</small></div>
  <select class="wb-select hide-sm" id="wbSelect" aria-label="切換班級學期"></select>
  <div class="progress-pill" title="已標記完成的學生數"><span class="bar"><i id="progBar"></i></span><span id="progText">0/0 完成</span></div>
  <div class="top-actions">
    <span class="save-state" id="saveState" role="status"></span>
    <button class="tbtn" data-open="overview"><span class="hide-sm">全班</span>總覽</button>
    <button class="tbtn" data-open="import">匯入</button>
    <button class="tbtn primary" data-open="export">匯出</button>
    <button class="tbtn" data-open="settings" aria-label="設定">⚙<span class="hide-sm"> 設定</span></button>
    <button class="tbtn hide-sm" data-open="help">說明</button>
  </div>
</header>
<div id="conflictBar" class="notice bad hidden" style="margin:0;border-radius:0"><span>另一個分頁修改了評語資料。為避免互相覆蓋，本頁已暫停儲存。</span><button class="btn sm" onclick="location.reload()">重新載入最新資料</button></div>

<div class="layout">
  <aside class="roster" id="roster" aria-label="班級名單">
    <div class="roster-head">

function codeText(code) { return CODE_INDEX[code]?.text || ''; }
function codePolarity(code) {
  const info = CODE_INDEX[code];
  if (!info) return 'pos';
  if (MILD_CODE_SET.has(code)) return 'mild';
  if (NEG_CATS.includes(info.cat) || NEG_CODE_SET.has(code)) return 'neg';

function getNick(st) {
  if (st.nick && st.nick.trim()) return st.nick.trim();
  const name = String(st.name || '').trim();
  if (!name) return '';
  if (/^[A-Za-z\s.'-]+$/.test(name)) return name.split(/\s+/)[0];
  if (name.length <= 2) return name;
  const compound = COMPOUND_SURNAMES.find(s => name.startsWith(s));
  if (compound && name.length > compound.length + 0) return name.slice(compound.length) || name;
  return name.slice(1);
}
function stageOf(wb) { return STAGES[`${wb.meta.grade || '1'}-${wb.meta.sem || '1'}`] || STAGES['1-1']; }
function isCapstone(wb) { return !!stageOf(wb).capstone; }
function pronounOf(st, wb) {
  if (isCapstone(wb)) return st.gender === 'girl' ? '她' : '他';
  return st.gender === 'girl' ? '妳' : '你';
}

function hashSeed(str) { let h = 2166136261; for (const ch of String(str)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return Math.abs(h); }
function makePicker(st) { const seed = hashSeed(st.id || st.name || 'x'); return (arr, k = 0) => arr[(seed + k * 7) % arr.length]; }
function fill(text, ctx) { return String(text).replace(/\{you\}/g, ctx.you).replace(/\{nick\}/g, ctx.nick).replace(/\{weak\}/g, ctx.weak || '較弱學科'); }
function endPunct(s) { s = String(s || '').trim(); return !s ? '' : /[。！？!?]$/.test(s) ? s : s + '。'; }
function stripEnd(s) { return String(s || '').trim().replace(/[。！？!?，、；;]+$/, ''); }
function joinList(arr) { if (arr.length <= 1) return arr.join(''); return arr.slice(0, -1).join('、') + '與' + arr[arr.length - 1]; }
function splitSubjects(text) { return String(text || '').split(/[、,，;；\s/／]+/).map(s => s.trim()).filter(Boolean); }

function collectAdvice(st) {
  const groups = [];
  const push = g => { if (g && !groups.includes(g)) groups.push(g); };
  (st.improve || []).forEach(push);
  Object.entries(traitDatabase).forEach(([cat, def]) => def.items.forEach(item => { if (st.traits?.[cat]?.[item.id] === 'neg') push(item.grp); }));
  if (st.attendance === 'late') push('late');
  if (st.attendance === 'absent') push('attend');
  if (st.academic?.level === 'weak') push(st.academic?.weak ? 'subject' : 'motivation');
  (st.codes || []).forEach(c => { if (codePolarity(c) === 'neg') push(CODE_TO_GROUP[c] || 'motivation'); });
  return groups;
}

const LENGTH_MAX = {auto: 350, lite: 200, standard: 280, full: 350};
function generateComment(st, wb) {
  const max = isCapstone(wb) ? 400 : (LENGTH_MAX[st.length || 'auto'] || 350);
  let text = '';
  for (let level = 0; level <= 4; level++) {
    text = composeComment(st, wb, level);
    if (countChars(text) <= max) return text;
  }
  return text;
}
function composeComment(st, wb, compact = 0) {
  const pick = makePicker(st);
  const nick = getNick(st) || '同學';
  const you = pronounOf(st, wb);
  const capstone = isCapstone(wb);
  const stage = stageOf(wb);
  const weakSubjects = splitSubjects(st.academic?.weak);
  const strongSubjects = splitSubjects(st.academic?.strong);
  const ctx = {you, nick, weak: weakSubjects.length ? joinList(weakSubjects) : ''};
  const plan = lengthPlan(st, wb);
  const sentences = [];
  const posCodes = (st.codes || []).filter(c => codePolarity(c) === 'pos');
  const mildCodes = (st.codes || []).filter(c => codePolarity(c) === 'mild');
  const byCat = cat => posCodes.filter(c => CODE_INDEX[c]?.cat === cat).map(codeText);
  const charCats = ['nature1', 'social', 'service', 'ambition', 'discipline'];
  const charCodes = posCodes.filter(c => charCats.includes(CODE_INDEX[c]?.cat)).map(codeText);
  let learnCodes = [...byCat('learning')];
  const skillCodes = byCat('skills');
  const traitPos = cat => (traitDatabase[cat]?.items || []).filter(i => st.traits?.[cat]?.[i.id] === 'pos').map(i => i.pos);

  // ① 德性品格（三年總評或沒有品格代碼時，向學代碼也可作為開頭形容）
  const adjPool = capstone ? [...learnCodes, ...charCodes] : charCodes.length ? charCodes : learnCodes;
  const adj = adjPool.slice(0, 2);
  const restChar = charCodes.filter(t => !adj.includes(t));
  learnCodes = learnCodes.filter(t => !adj.includes(t));
  const anecdote = stripEnd(st.anecdote);
  const overlaps = p => adj.some(a => p.includes(a.slice(0, 2)) || p.includes(a.slice(2)));
  const persona = [...traitPos('personality'), ...traitPos('social')].filter(p => !overlaps(p));
  if (capstone) {
    const lead = adj.length ? `${nick}同學高中三年${adj.join('、')}` : `${nick}同學高中三年來穩健成長`;
    sentences.push(endPunct(anecdote ? `${lead}，${anecdote}` : persona.length ? `${lead}，${persona.shift()}` : lead));
  } else if (adj.length) {
    const lead = `${nick}，${you}是一位${adj.join('、')}的學生`;
    sentences.push(endPunct(anecdote ? `${lead}，${anecdote}` : persona.length ? `${lead}，${persona.shift()}` : lead));
  } else if (anecdote) {
    sentences.push(endPunct(`${nick}，${anecdote}`));
  } else if (persona.length) {
    sentences.push(endPunct(`${nick}，${you}${persona.shift()}`));
  } else {
    sentences.push(pick([`${nick}，這學期${you}在班上的點滴表現，老師都看在眼裡。`, `${nick}，這學期老師看見了${you}許多的努力與成長。`]));
  }
  const charExtra = compact >= 1 ? [] : [...persona.slice(0, 2)];
  if (restChar.length) charExtra.unshift(`平日${restChar.join('、')}`);
  if (charExtra.length) sentences.push(endPunct(charExtra.join('，')));
  const habit = compact >= 1 ? [] : traitPos('habit');
  if (habit.length) sentences.push(endPunct(`生活常規上，${habit.slice(0, 3).join('，')}`));

  // ② 學業表現
  const acad = [];
  const level = st.academic?.level;
  if (learnCodes.length) acad.push(`${you}${learnCodes.join('、')}`);
  if (level === 'top') acad.push(pick(['學業成績表現十分優異，段考成績名列前茅，是同學學習的榜樣', '段考成績始終名列前茅，充分展現在學業上的實力'], 1));
  else if (level === 'good') acad.push('學業表現優良，學習態度認真踏實');
  else if (level === 'steady') acad.push('課業表現穩定，能按部就班完成各科學習');
  else if (level === 'progress') acad.push(`成績呈現穩定進步的趨勢，顯示${you}在課業上的努力已逐漸展現成效`);
  else if (level === 'weak') acad.push('目前仍在摸索最契合自己的讀書節奏');
  if (strongSubjects.length) acad.push(`尤其在${joinList(strongSubjects)}方面表現突出`);
  if (skillCodes.length) acad.push(`${skillCodes.join('、')}`);
  const acadTraits = compact >= 2 ? [] : traitPos('academic').slice(0, compact >= 1 ? 1 : 3);
  if (acad.length || acadTraits.length) {
    const first = acad.slice(0, 3);
    const lead = pick(['在課業學習方面，', '課業上，'], 2);
    if (first.length) sentences.push(endPunct(lead + first.join('，')));
    const more = [...acad.slice(3), ...acadTraits.slice(0, 3)];
    if (more.length) sentences.push(endPunct((first.length ? '' : lead) + more.join('，')));
  }
  mildCodes.forEach(c => {
    const area = CODE_INDEX[c]?.cat === 'discipline' ? '生活常規上' : CODE_INDEX[c]?.cat === 'social' ? '交友上' : '學習上';
    sentences.push(`${you}在${area}${codeText(c)}，若能再多一分積極與主動，表現定能更上一層樓。`);
  });
  if (st.attendance === 'full') sentences.push(capstone ? '在校期間出席穩定，學習態度十分積極。' : '這學期全勤，準時到校上課，學習態度十分積極。');
  else if (st.attendance === 'good') sentences.push('出缺勤情形良好，能準時到校上課。');

  // ③ 職務服務
  const cadres = st.cadres || [];
  if (plan.service && cadres.length) {
    if (capstone) {
      sentences.push(endPunct(`先後擔任${cadres.map(c => c.role).join('、')}等職務，盡心盡責，展現優秀的服務精神與責任感`));
    } else {
      cadres.slice(0, compact >= 3 ? 1 : 2).forEach((c, i) => {
        const perf = CADRE_PERF.find(p => p.key === c.perf) || CADRE_PERF[0];
        const desc = compact >= 2 ? '' : roleDescription(c.role);
        const lead = i === 0 ? (sentences.length > 2 ? pick(['在兼顧學業之餘，', '對於班級公共事務，'], 3) : '') + `這學期擔任${c.role}` : `此外也擔任${c.role}`;
        sentences.push(endPunct([lead, desc, perf.text].filter(Boolean).join('，')));
      });
      const shown = compact >= 3 ? 1 : 2;
      if (cadres.length > shown) sentences.push(endPunct(`另擔任${cadres.slice(shown).map(c => c.role).join('、')}，同樣用心投入`));
    }
  }
  const serviceCodes = byCat('service').filter(t => !adj.includes(t) && !restChar.includes(t));
  if (plan.service && st.service) sentences.push(endPunct(`${you}也參與${stripEnd(st.service)}，展現熱心服務的精神`));
  else if (plan.service && serviceCodes.length && !cadres.length) sentences.push(endPunct(`在班級事務上${serviceCodes.join('、')}`));

  // ④ 特殊事蹟
  const acts = st.acts || [];
  if (plan.special && acts.length) {
    const items = acts.slice(0, 3).map(a => {
      const name = stripEnd(a.name).replace(/^(參加|參與)/, '');
      return a.result ? `參加${name}榮獲${stripEnd(a.result).replace(/^(獲得|榮獲)/, '')}` : `參與${name}`;
    });
    const cats = [...new Set(acts.slice(0, 3).map(a => a.cat || guessActCat(a.name)))];
    const cat = cats.length === 1 ? (ACT_CATS.find(c => c.key === cats[0]) || ACT_CATS[ACT_CATS.length - 1]) : {trait: '多方面的實力與熱忱'};
    const lead = pick(['在課堂與班級之外，', '課餘時間，'], 4) + `${you}積極拓展視野，`;
    sentences.push(endPunct(`${lead}${items.join('；')}${acts.length > 3 ? '等' : ''}，展現${cat.trait}`));
  }
  if (plan.special && st.club) sentences.push(endPunct(`${acts.length ? '此外也參與' : '課餘參與'}${stripEnd(st.club)}，持續投入自己的興趣`));

  // 導師補充觀察
  const free = stripEnd(st.free);
  if (free) sentences.push(endPunct(/^(此外|另外|同時|值得一提|而且|不過|然而)/.test(free) ? free : `此外，${free}`));

  // ⑤ 期許結尾
  const advice = collectAdvice(st).slice(0, compact >= 4 ? 1 : 2).map(g => fill(REFRAME_TEXT[g] || '', ctx)).filter(Boolean);
  const enc = stripEnd(st.enc);
  if (capstone) {
    if (advice.length) sentences.push(endPunct(`${advice.join('；')}`));
    const field = strongSubjects.length ? `在${joinList(strongSubjects)}相關領域持續深耕，` : '';
    sentences.push(enc ? endPunct(enc) : `期許${nick}進入大學後，延續高中三年累積的努力與熱忱，${field}在新的學習階段持續精進、發光發熱！`);
  } else {
    if (advice.length) sentences.push(endPunct(stage.prefix + advice.join('；同時')));
    if (enc) sentences.push(endPunct(enc));
    else if (st.tone === 'neutral') sentences.push(`期盼${you}能持續精進，為未來打下穩固的基礎。`);
    else if (st.tone === 'strict') sentences.push(`希望${you}能正視自己可以再進步的地方，展現更成熟穩健的態度，老師會一直為${you}加油。`);
    else if (advice.length) sentences.push(pick([`相信只要下定決心、持之以恆，${you}一定能做得更好，加油！`, `老師相信${you}一定做得到，加油！`], 5));
    else sentences.push(pick([`期許${nick}未來能繼續保持這份認真與熱忱，相信憑藉${you}的努力，定能再創佳績，加油！`, `${stage.prefix}希望${nick}繼續保持這份用心，在學習與生活上更上一層樓，加油！`], 6));
  }
  return sentences.join('');
}

function generateSpecial(st, wb) {
  const lines = [];
  const cadres = st.cadres || [];
  if (cadres.length) {
    const groups = {};
    cadres.forEach(c => { const p = CADRE_PERF.find(x => x.key === c.perf) || CADRE_PERF[0]; (groups[p.special] = groups[p.special] || []).push(c.role); });
    Object.entries(groups).forEach(([txt, roles]) => lines.push(`${isCapstone(wb) ? '曾' : '本學期'}擔任${roles.join('、')}，${txt}。`));
  }
  const seen = new Set();
  (st.acts || []).forEach(a => {
    const name = stripEnd(a.name);
    if (!name) return;
    const level = a.level && !name.includes(a.level) && !/^(臺北市|台北市|全國|國際)/.test(name) ? a.level : '';
    const verb = /^(參加|參與|擔任|獲|榮獲|通過|完成)/.test(name) ? '' : '參加';
    const res = a.result ? `，獲得${stripEnd(a.result).replace(/^(獲得|榮獲)/, '')}` : '';
    const line = `${verb}${level}${name}${res}。`;
    seen.add(name); lines.push(line);
  });
  if (st.club) lines.push(endPunct(`參與${stripEnd(st.club).replace(/^參與/, '')}社團活動`.replace(/社社團/, '社團').replace(/社團社團/, '社團')));
  if (st.service) lines.push(endPunct(stripEnd(st.service)));
  if (st.includeSelf !== false) {
    SELF_FIELDS.filter(f => f.special).forEach(f => {
      if (f.id === 'selfClub' && st.club) return;
      if (f.id === 'selfSchoolService' && st.service) return;
      String(st.self?.[f.id] || '').split(/[\n；;]+/).map(stripEnd).filter(Boolean).forEach(v => {
        if ([...seen].some(s => v.includes(s) || s.includes(v)) || lines.some(l => l.includes(v))) return;
        lines.push(endPunct(v));
      });
    });
  }
  if (st.attendance === 'full' && !isCapstone(wb)) lines.push('本學期全勤。');
  const uniq = [...new Set(lines)];
  if (st.specialFormat === 'list') return uniq.map((l, i) => `${i + 1}. ${l}`).join('\n');
  return uniq.join('');
}

// 八大品質檢核 + 四大紅線

function inputCorpus(st) {
  return [st.name, st.anecdote, st.free, st.enc, st.service, st.club, st.prev, st.prevSpecial, st.selfNote,
    ...(st.acts || []).flatMap(a => [a.name, a.result]), ...Object.values(st.self || {}), ...(st.cadres || []).map(c => c.role)].join('｜');
}
function checkComment(st, wb) {
  const text = String(st.final || '').trim();
  const nick = getNick(st);
  const capstone = isCapstone(wb);
  const items = [];
  const add = (ok, label, detail, level = ok ? 'ok' : 'warn') => items.push({ok, label, detail, level});
  if (!text) return {items: [], red: [], harsh: [], score: 0, total: 8, empty: true};
  // 01 稱謂
  const name = String(st.name || '').trim();
  let callOk = true, callDetail = '';
  if (/該生/.test(text)) { callOk = false; callDetail = '出現「該生」，請改用名字。'; }
  else if (!nick) { callOk = false; callDetail = '尚未輸入學生姓名。'; }
  else if (capstone && !text.startsWith(`${nick}同學`)) { callOk = false; callDetail = `三年總評建議以「${nick}同學高中三年…」開頭。`; }
  else if (!capstone && !text.startsWith(nick)) { callOk = false; callDetail = `建議以「${nick}，${pronounOf(st, wb)}是一位…」開頭。`; }
  else if (name.length >= 3 && name !== nick && text.includes(name)) { callOk = false; callDetail = '評語中出現全名，建議只寫名不帶姓。'; }
  add(callOk, '稱謂：單用名、不帶姓', callOk ? `以「${nick}」稱呼` : callDetail);
  // 02 代詞
  let proOk = true, proDetail = '';
  if (!st.gender) { proOk = false; proDetail = '尚未設定性別，無法檢查你／妳。'; }
  else if (capstone && /[你妳]/.test(text)) { proOk = false; proDetail = '三年總評建議改用客觀描述（他／她）。'; }
  else if (!capstone && st.gender === 'boy' && /妳/.test(text)) { proOk = false; proDetail = '男生出現「妳」。'; }
  else if (!capstone && st.gender === 'girl' && /你/.test(text)) { proOk = false; proDetail = '女生出現「你」。'; }
  add(proOk, '代詞：男「你」女「妳」全篇一致', proOk ? '代詞一致' : proDetail);
  // 03 具體事例
  const concrete = !!(stripEnd(st.anecdote) || (st.acts || []).length || (st.cadres || []).length || stripEnd(st.free));
  add(concrete, '特質有具體事例佐證', concrete ? '已有具體事例' : '建議補一件記得的具體小事，評語會更像您寫的。');
  // 04 事實不捏造
  const corpus = inputCorpus(st);
  const tokens = [...new Set(text.match(AWARD_TOKENS) || [])].filter(t => !corpus.includes(t));
  add(!tokens.length, '事蹟真實、不捏造', tokens.length ? `評語中有輸入資料沒有的獎項字眼：${tokens.join('、')}，請確認。` : '未發現新增的獎項或名次');
  // 05 零批判
  const harsh = HARSH_WORDS.filter(h => h.re.test(text)).map(h => ({word: (text.match(h.re) || [''])[0], tip: h.tip}));
  add(!harsh.length, '零批判字眼，採成長建議', harsh.length ? harsh.map(h => `「${h.word}」：${h.tip}`).join('；') : '語氣正向');
  // 06 結尾
  const lastSentence = text.split(/(?<=[。！？!?])/).filter(s => s.trim()).pop() || '';
  const endOk = /期許|希望|期待|期盼|相信|加油|祝|勉勵|盼/.test(lastSentence);
  add(endOk, '結尾具體期許與鼓勵', endOk ? '結尾有期許' : '最後一句建議加入具體期許與鼓勵。');
  // 07 代碼
  const n = (st.codes || []).length;
  add(n >= 1 && n <= 3, '評語代碼 1–3 個', n === 0 ? '尚未選擇評語代碼。' : n > 3 ? `已選 ${n} 個，校務系統通常只登錄 1–3 個。` : `已選 ${n} 個`);
  // 08 字數
  const len = countChars(text);
  const [min, max] = capstone ? [300, 400] : [150, 350];
  const lenOk = len >= min && len <= max;
  add(lenOk, `字數 ${min}–${max} 字`, lenOk ? `${len} 字` : len < min ? `${len} 字，偏短，可補充具體觀察。` : `${len} 字，偏長，建議精簡。`);
  // 紅線
  const red = RED_LINES.filter(r => r.re.test(text)).map(r => ({label: r.label, word: (text.match(r.re) || [''])[0], tip: r.tip}));
  const score = items.filter(i => i.ok).length;
  return {items, red, harsh, score, total: items.length, len, min, max};
}
function countChars(text) { return String(text || '').replace(/\s/g, '').length; }

function checkSpecial(st) {
  const text = String(st.special || '');
  return RED_LINES.filter(r => r.re.test(text)).map(r => ({label: r.label, word: (text.match(r.re) || [''])[0], tip: r.tip}));
}

  if ((st.acts || []).length) facts.push(`活動與競賽：${st.acts.map(a => `${a.level && !String(a.name).includes(a.level) && !/^(臺北市|台北市|全國|國際)/.test(a.name) ? a.level + '｜' : ''}${mask(a.name)}${a.result ? '，成果：' + mask(a.result) : ''}`).join('；')}`);
  if (st.club) facts.push(`社團：${mask(st.club)}`);

  if (st.academic?.weak) facts.push(`待加強學科：${st.academic.weak}`);
  const att = ATTENDANCE.find(a => a.key === st.attendance);
  if (att) facts.push(`出缺勤：${att.label}`);
  const weakList = splitSubjects(st.academic?.weak);
  const advice = collectAdvice(st).slice(0, 2).map(g => fill(REFRAME_TEXT[g] || '', {you: capstone ? '他／她' : (st.gender === 'girl' ? '妳' : '你'), nick: MASK, weak: weakList.length ? joinList(weakList) : ''})).filter(Boolean);
  if (st.free) facts.push(`導師補充觀察：${mask(st.free)}`);

學生代稱：${MASK}（請原樣保留「${MASK}」這個代稱，系統會自動換回學生名字）

${facts.map(f => '- ' + f).join('\n')}
${advice.length ? '需以正向重塑方式寫入的成長建議：\n' + advice.map(a => '- ' + a).join('\n') : ''}

7. 只輸出評語本文，不要標題、條列、引號或任何說明。`;
}
const MASK = '○○';
function deidentify(text, st) {
  let out = String(text || '');
  const name = String(st.name || '').trim();
  const nick = getNick(st);
  [name, nick].filter(s => s && s.length >= 2).sort((a, b) => b.length - a.length).forEach(s => { out = out.split(s).join(MASK); });
  return out;
}
function reidentify(text, st) {
  return String(text || '').split(MASK).join(getNick(st) || '同學').replace(/^["「『]|["」』]$/g, '').trim();
}

const STORE_KEY = 'lssh.comment.v2';
const OLD_PREFIX = 'lssh.comment.draft.v1:';

const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2));

function blankStudent(seed = {}) {
  return Object.assign({
    id: uid(), seat: '', no: '', name: '', gender: '', nick: '', tone: 'encouraging', length: 'auto',
    codes: [], anecdote: '', traits: {personality:{}, social:{}, academic:{}, habit:{}},

    cadres: [], acts: [], club: '', service: '', free: '', enc: '',
    self: Object.fromEntries(SELF_FIELDS.map(f => [f.id, ''])), selfNote: '', prev: '', prevSpecial: '',
    final: '', finalEdited: false, history: [], polishedBy: '', special: '', specialEdited: false, specialFormat: 'para', includeSelf: true,
    done: false, updatedAt: ''
  }, seed);
}
function defaultMeta() {
  const d = new Date();
  const year = d.getFullYear() - 1911 - (d.getMonth() < 7 ? 1 : 0);
  return {cls: '', year: String(year), sem: d.getMonth() >= 1 && d.getMonth() <= 6 ? '2' : '1', grade: '1', teacher: ''};
}
function blankWorkbook(meta) { return {id: uid(), meta: Object.assign(defaultMeta(), meta || {}), students: [], activeId: null, createdAt: new Date().toISOString(), updatedAt: ''}; }

let store = null, saveTimer = null, conflict = false, lastSaved = '';
const ui = {step: 1, codeCat: 'all', codeQuery: '', roleTab: 'cadre', filter: 'all', search: '', aiBusy: false, batchStop: false};

function normalizeStudent(s) {
  const b = blankStudent();
  const out = Object.assign(b, s || {});
  out.traits = Object.assign(b.traits, s?.traits || {});
  out.academic = Object.assign({level:'', strong:'', weak:''}, s?.academic || {});
  out.self = Object.assign(Object.fromEntries(SELF_FIELDS.map(f => [f.id, ''])), s?.self || {});
  ['codes','improve','cadres','acts','history'].forEach(k => { if (!Array.isArray(out[k])) out[k] = []; });
  out.codes = out.codes.filter(c => CODE_INDEX[c]);
  return out;
}
function loadStore() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      if (data && data.version === 2 && data.workbooks) {
        Object.values(data.workbooks).forEach(wb => { wb.meta = Object.assign(defaultMeta(), wb.meta); wb.students = (wb.students || []).map(normalizeStudent); });
        store = data; lastSaved = raw;
      }
    }
  } catch (e) { console.error(e); toast('⚠️ 讀取本機資料失敗，原資料保留未覆蓋。請先到「匯出」備份。'); conflict = true; }
  if (!store) { const wb = blankWorkbook(); store = {version: 2, activeWb: wb.id, workbooks: {[wb.id]: wb}}; }
  if (!store.workbooks[store.activeWb]) store.activeWb = Object.keys(store.workbooks)[0];
}
function saveNow() {
  clearTimeout(saveTimer);
  if (conflict) { setSaveState('⚠ 已暫停儲存'); return false; }
  try {
    const current = localStorage.getItem(STORE_KEY);
    if (current && lastSaved && current !== lastSaved) { conflict = true; $('conflictBar').classList.remove('hidden'); setSaveState('⚠ 已暫停儲存'); return false; }
    const raw = JSON.stringify(store);
    localStorage.setItem(STORE_KEY, raw); lastSaved = raw;
    setSaveState('✓ 已自動儲存 ' + new Date().toLocaleTimeString('zh-TW', {hour:'2-digit', minute:'2-digit'}));
    return true;
  } catch (e) { setSaveState('⚠ 儲存失敗'); toast('⚠️ 瀏覽器儲存空間不足或被封鎖，請立即「匯出 → 備份 JSON」。'); return false; }
}
function queueSave() { setSaveState('儲存中…'); clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 400); }
function setSaveState(t) { $('saveState').textContent = t; }

const WB = () => store.workbooks[store.activeWb];
const CUR = () => WB().students.find(s => s.id === WB().activeId) || null;
function sortStudents(wb) { wb.students.sort((a, b) => (parseInt(a.seat, 10) || 999) - (parseInt(b.seat, 10) || 999) || String(a.name).localeCompare(String(b.name), 'zh-Hant')); }
function wbLabel(wb) { const st = STAGES[`${wb.meta.grade}-${wb.meta.sem}`]; return `${wb.meta.cls || '未命名班級'}｜${wb.meta.year || ''}學年 ${st ? st.label : ''}`; }

function touch(st, opts = {}) {
  st.updatedAt = new Date().toISOString();
  WB().updatedAt = st.updatedAt;
  if (!opts.keepFinal && !st.finalEdited) st.final = hasContent(st) ? generateComment(st, WB()) : '';
  if (!opts.keepFinal && !st.specialEdited) st.special = generateSpecial(st, WB());
  if (st.done && !opts.keepDone) { const c = checkComment(st, WB()); if (c.red.length) st.done = false; }
  queueSave(); renderPreview(); renderRosterItem(st); renderProgress();
}
function hasContent(st) {
  return !!(st.codes.length || st.anecdote || st.cadres.length || st.acts.length || st.academic.level || st.attendance || st.improve.length || st.free || st.enc || st.club || st.service ||
    Object.values(st.traits).some(o => Object.keys(o).length));
}
function studentStatus(st) {
  if (st.done) return 'done';
  if (!st.final) return 'empty';

  return c.red.length ? 'issue' : 'draft';
}

function moveStudent(delta) {
  const list = WB().students; if (!list.length) return;

function copyText(text) {

  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done)); else fallbackCopy(text, done);
}
function fallbackCopy(text, done) {

}

function parseRosterText(text) {
  return String(text || '').split(/\r?\n/).map(line => line.trim()).filter(Boolean).map(line => {
    const cells = line.split(/\t|,|，|\s{1,}/).map(c => c.trim()).filter(Boolean);
    let seat = '', name = '', gender = '', no = '';
    cells.forEach(c => {
      if (/^[男女]$|^(男生|女生)$/.test(c)) gender = c.startsWith('女') ? 'girl' : 'boy';
      else if (/^\d{1,2}$/.test(c) && !seat) seat = c.padStart(2, '0');
      else if (/^\d{5,}$/.test(c)) no = c;
      else if (!name && !/^(座號|姓名|性別|學號)$/.test(c)) name = c;
    });
    return {seat, name, gender, no};
  }).filter(r => r.name);
}

const PII_RE = /手機|電話|住址|地址|身分證|身份證|生日|出生|父|母|監護|家長|電子郵件|email|e-mail|時間戳記|健康|病史|過敏|血型|帳號|密碼/i;
const normH = t => String(t || '').replace(/\s+/g, '').replace(/[：:（）()]/g, '').toLowerCase();
function guessTarget(header) {

  if (/^(座號|座位|號碼|seat)$/.test(h)) return 'seat';
  if (/^(學生姓名|姓名|名字|學生|name)$/.test(h)) return 'name';
  if (/性別/.test(h)) return 'gender';
  if (/學號/.test(h)) return 'no';
  if (/評語代[碼號]|導師評語代/.test(h)) return 'codes';
  if (/(個性|性情|向學|進取|紀律|交友|服務|擅長)描述|^擅長$/.test(h)) return 'codesOrNote';
  if (/小老師/.test(h)) return 'teacherRole';
  if (/幹部|職務/.test(h)) return 'cadre';
  if (/^社團名稱$|^社團$/.test(h)) return 'club';
  if (/^職稱$|社團職稱/.test(h)) return 'clubTitle';
  if (/社團表現/.test(h)) return 'self.selfClub';
  for (const f of SELF_FIELDS) if (f.aliases.some(a => normH(a) === h)) return 'self.' + f.id;
  if (/較強科目|優勢學科|強項/.test(h)) return 'strong';
  if (/較弱科目|弱勢學科|待加強學科/.test(h)) return 'weak';
  if (/本學期.*評語/.test(h)) return 'final';
  if (/文字描述評語|德行評語|導師評語|^評語$/.test(h)) return 'prev';
  if (/日常表現|日常生活表現/.test(h)) return 'prev';
  if (/特殊.*表現/.test(h)) return 'prevSpecial';
  if (/競賽|比賽|活動|獲獎|得獎/.test(h)) return 'act';

async function readImportFile(file) {
  if (!file) return;
  const ext = file.name.split('.').pop().toLowerCase();
  $('impStatus').textContent = '讀取中…';
  try {
    if (ext === 'docx') {
      if (!window.JSZip) throw new Error('Word 解析元件未載入，請確認網路連線後重新整理');
      const zip = await JSZip.loadAsync(await file.arrayBuffer());
      const xml = await zip.file('word/document.xml')?.async('text');
      if (!xml) throw new Error('找不到 Word 文件內容');
      const row = parseDocxSelfEvalRow(new DOMParser().parseFromString(xml, 'application/xml'), file.name);
      const headers = Object.keys(row);
      showTableMapping(file.name, headers, [headers.map(h => row[h])]);
      return;
    }
    if (!window.XLSX) throw new Error('Excel 解析元件未載入，請確認網路連線後重新整理');
    const wbx = XLSX.read(new Uint8Array(await file.arrayBuffer()), {type: 'array'});
    const sheet = wbx.SheetNames[0];
    const matrix = XLSX.utils.sheet_to_json(wbx.Sheets[sheet], {header: 1, defval: ''}).map(r => r.map(c => String(c ?? '').trim()));
    let hr = -1;
    for (let r = 0; r < Math.min(8, matrix.length); r++) {
      const known = matrix[r].filter(c => !['ignore'].includes(guessTarget(c))).length;
      if (known >= 2 && matrix[r].some(c => ['name', 'seat'].includes(guessTarget(c)))) { hr = r; break; }
    }
    if (hr >= 0) {
      const rows = matrix.slice(hr + 1).filter(r => r.some(Boolean));
      showTableMapping(`${file.name}（${sheet}）`, matrix[hr], rows);
    } else {
      showKeyValueMapping(file.name, matrix, sheet);
    }
  } catch (err) { console.error(err); $('impStatus').textContent = '⚠️ ' + err.message; }
}

function guessKv(src) {
  if (/特殊表現/.test(src) && /導師評語|五、特殊表現/.test(src)) return 'prevSpecial';
  if (/文字描述評語/.test(src)) return 'prev';
  if (/評語代號|日常表現/.test(src)) return 'codes';
  if (/(性情|向學|進取|紀律|交友|服務|擅長)描述/.test(src)) return 'codes';
  const g = guessTarget(src.split('／').pop());
  if (g !== 'ignore') return g;
  if (/學業|成績|班排|類組排/.test(src)) return 'self.selfAcademic';
  if (/活動|競賽/.test(src)) return 'act';
  return 'ignore';
}

// Word 自評表解析（沿用舊版欄位）
function parseDocxSelfEvalRow(doc, fileName) {
  const ns = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
  const txt = el => Array.from(el.getElementsByTagNameNS(ns, 'p')).map(p => Array.from(p.getElementsByTagNameNS(ns, 't')).map(t => t.textContent || '').join('').trim()).filter(Boolean).join(' ').trim();
  const tables = Array.from(doc.getElementsByTagNameNS(ns, 'tbl')).map(tb => Array.from(tb.getElementsByTagNameNS(ns, 'tr')).map(tr => Array.from(tr.getElementsByTagNameNS(ns, 'tc')).map(txt)));
  const paras = Array.from(doc.getElementsByTagNameNS(ns, 'p')).map(p => Array.from(p.getElementsByTagNameNS(ns, 't')).map(t => t.textContent || '').join('').trim()).filter(Boolean);
  const row = {};
  const clean = v => String(v || '').replace(/^(一|二|三|四|五|六|七|八|九|十)$/g, '').replace(/高[一二三][上下]/g, '').replace(/^(個性描述|性情描述|向學描述|進取描述|紀律描述|交友描述|服務描述|擅長描述)[:：]?/g, '').replace(/\s+/g, ' ').trim();
  const pairs = [['座號', /座號[:：]\s*(\d+)/], ['姓名', /姓名[:：]\s*([^\s座]+)/], ['個性描述', /個性描述[:：]\s*(.+)$/], ['性情描述', /性情描述[:：]\s*(.+)$/], ['向學描述', /向學描述[:：]\s*(.+)$/], ['進取描述', /進取描述[:：]\s*(.+)$/], ['紀律描述', /紀律描述[:：]\s*(.+)$/], ['交友描述', /交友描述[:：]\s*(.+)$/], ['服務描述', /服務描述[:：]\s*(.+)$/], ['擅長描述', /擅長描述[:：]\s*(.+)$/]];
  paras.forEach(t => pairs.forEach(([k, re]) => { const m = t.match(re); if (m && isMeaningful(m[1])) row[k] = clean(m[1]); }));
  const catMap = {'學校服務類':'學校服務','社團表現類':'社團表現','學業表現類':'學業表現','生活常規類':'生活常規','社會服務類':'社會服務','活動表演類':'活動表演','科學展覽類':'科學展覽'};
  tables.forEach((table, ti) => {
    if (ti === 0) table.flat().forEach(cell => ['性情描述','向學描述','進取描述','紀律描述','交友描述','服務描述','擅長描述'].forEach(l => { if (cell.includes(l)) { const v = clean(cell.replace(l, '').replace(/^[:：]/, '')); if (isMeaningful(v)) row[l] = v; } }));
    let key = '';
    table.forEach(cells => {
      const lab = Object.keys(catMap).find(l => cells.some(c => c.includes(l))) || (cells.some(c => c.includes('其他特殊表現')) ? '其他特殊表現' : '');
      if (lab) key = lab === '其他特殊表現' ? (ti <= 1 ? '校內其他特殊表現' : '校外其他特殊表現') : catMap[lab];
      if (!key || ti === 0) return;
      const vals = cells.filter(c => !Object.keys(catMap).some(l => c.includes(l)) && !c.includes('其他特殊表現')).map(clean).filter(isMeaningful);
      if (vals.length) row[key] = [row[key], ...vals].filter(Boolean).join('；');
    });
  });
  if (!row['姓名']) { const g = fileName.replace(/\.[^.]+$/, '').match(/([一-龥]{2,4})/); if (g) row['姓名'] = g[1]; }
  return row;
}

// 舊版草稿與備份
function countOldDrafts() { let n = 0; try { for (let i = 0; i < localStorage.length; i++) if (localStorage.key(i)?.startsWith(OLD_PREFIX)) n++; } catch {} return n; }
function convertOldRecord(rec) {
  const c = rec?.content; if (!c?.fields || !c?.formState) return null;
  const f = c.fields, fs = c.formState, ctx = c.context || {};
  const perfMap = {responsible: 'responsible', leadership: 'leadership', passive: 'more', improve: 'more'};
  const st = blankStudent({
    seat: ctx.draftSeat ? String(ctx.draftSeat).padStart(2, '0') : '', no: ctx.draftStudentNo || '', name: f.studentName || '',
    gender: fs.gender === 'girl' ? 'girl' : fs.gender === 'boy' ? 'boy' : '', tone: ['encouraging','neutral','strict'].includes(fs.tone) ? fs.tone : 'encouraging',
    codes: (fs.selectedCodes || []).filter(x => CODE_INDEX[x]),
    cadres: (fs.cadres || []).map(x => ({id: uid(), role: String(x.role || ''), perf: perfMap[x.perf] || 'responsible'})).filter(x => x.role),
    acts: (fs.activities || []).map(x => ({id: uid(), cat: guessActCat(x.name), level: guessActLevel(x.name), name: String(x.name || ''), result: String(x.result || '')})).filter(x => x.name),
    free: f.freeInput || '', enc: f.teacherEncouragement || ''
  });
  ['personality','social','academic','habit'].forEach(k => { Object.entries(fs.traits?.[k] || {}).forEach(([id, v]) => { if (traitDatabase[k].items.some(i => i.id === id) && (v === 'pos' || v === 'neg')) st.traits[k][id] = v; }); });
  SELF_FIELDS.forEach(sf => { st.self[sf.id] = f[sf.id] || ''; });
  if (f.finalComment) { st.final = f.finalComment; st.finalEdited = true; }
  if (f.dlSpecialPerformance) { st.special = f.dlSpecialPerformance; st.specialEdited = true; }
  return {st, ctx};
}
function migrateOldDrafts() {
  const wb = WB(); let n = 0;
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i); if (!k?.startsWith(OLD_PREFIX)) continue;
    try { const r = convertOldRecord(JSON.parse(localStorage.getItem(k))); if (r && (r.st.name || r.st.final)) { wb.students.push(r.st); n++; if (!wb.meta.cls && r.ctx.draftClass && r.ctx.draftClass !== '未命名班級') wb.meta.cls = r.ctx.draftClass; } } catch {}
  }
  sortStudents(wb); if (!CUR()) wb.activeId = wb.students[0]?.id;
  queueSave(); closeModal(); renderAll();
  toast(n ? `已匯入 ${n} 份舊版草稿（舊版資料仍保留在瀏覽器中）` : '沒有可匯入的舊版草稿');
}
async function restoreBackup(file) {
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    let added = 0;
    if (data?.appName === '導師評語生成系統' && data.version === 2 && data.workbooks) {
      Object.values(data.workbooks).forEach(w => {
        const wb = Object.assign(blankWorkbook(w.meta), {students: (w.students || []).map(s => normalizeStudent({...s, id: uid()}))});
        wb.activeId = wb.students[0]?.id || null; store.workbooks[wb.id] = wb; store.activeWb = wb.id; added++;
      });
    } else if (data?.appName === '導師評語草稿' && Array.isArray(data.drafts)) {
      const wb = blankWorkbook({cls: '舊版草稿匯入'});
      data.drafts.forEach(d => { const r = convertOldRecord(d); if (r) wb.students.push(r.st); });
      sortStudents(wb); wb.activeId = wb.students[0]?.id || null; store.workbooks[wb.id] = wb; store.activeWb = wb.id; added = 1;
    } else throw new Error('不是本系統的備份檔');
    queueSave(); closeModal(); renderAll(); toast(`已還原 ${added} 個班級學期，可在上方選單切換`);
  } catch (e) { toast('⚠️ 還原失敗：' + e.message); }
}

        <div class="field"><label>班級</label><input class="in" id="sCls" value="${esc(m.cls)}" placeholder="例：201"></div>
        <div class="field"><label>學年度</label><input class="in" id="sYear" value="${esc(m.year)}" inputmode="numeric"></div>
        <div class="field"><label>年級學期</label><select class="in" id="sStage">${Object.entries(STAGES).map(([k, v]) => `<option value="${k}" ${k === `${m.grade}-${m.sem}` ? 'selected' : ''}>${v.label}</option>`).join('')}</select></div>
      </div>

      ${opts.newWb ? `<div class="row" style="margin-top:8px"><label><input type="radio" name="newMode" value="copy" ${WB().students.length ? 'checked' : 'disabled'}> 沿用目前名單（上學期評語保留為參考）</label><label><input type="radio" name="newMode" value="blank" ${WB().students.length ? '' : 'checked'}> 空白名單</label></div>` :
      `<div class="row" style="margin-top:10px"><button class="btn danger" id="sDelWb">刪除這個班級學期</button></div>`}
    </div>
    ${opts.newWb ? '' : `<div class="sec"><h3>AI 潤飾</h3>
      <p class="hint">系統內建的評語生成完全在瀏覽器中完成，不需要 AI。若要再請 AI 潤飾，可設定 Gemini 或 ChatGPT API 金鑰。<b>送出前會把學生姓名換成「○○」，也不會送出座號、學號與學生自評原文。</b></p>
      <div class="grid2" style="margin-top:8px">
        <div class="field"><label>服務</label><select class="in" id="aiProv"><option value="none" ${p === 'none' ? 'selected' : ''}>不使用 AI</option><option value="gemini" ${p === 'gemini' ? 'selected' : ''}>Google Gemini</option><option value="openai" ${p === 'openai' ? 'selected' : ''}>ChatGPT／OpenAI</option></select></div>
        <div class="field"><label>自訂模型（選填）</label><input class="in" id="aiModel" value="${esc(getAiModel(p))}" placeholder="留空則自動選擇可用模型"></div>
      </div>
      <div class="field" style="margin-top:8px"><label>API 金鑰</label><input class="in" type="password" id="aiKey" value="${esc(getAiKey(p))}" placeholder="貼上金鑰" autocomplete="off"></div>
      <div class="row" style="margin-top:6px"><label><input type="checkbox" id="aiRemember" ${aiRemembered(p) ? 'checked' : ''}> 記住金鑰（存在這台電腦的瀏覽器；公用電腦請勿勾選）</label></div>
      <div class="row" style="margin-top:6px"><button class="btn sm" id="aiGetKey">取得 API 金鑰</button><button class="btn sm" id="aiDocs">查詢模型名稱</button><button class="btn sm" id="aiPreview" ${CUR() ? '' : 'disabled'}>預覽送出內容</button><button class="btn sm danger" id="aiForget">清除已存金鑰</button></div>
      <pre class="ref hidden" id="aiPromptBox" style="margin-top:8px;max-height:260px"></pre></div>`}`,
    foot: `<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" id="sSave">${opts.newWb ? '建立' : '儲存設定'}</button>`};
}
modalSettings.after = opts => {
  const readMeta = () => { const [grade, sem] = $('sStage').value.split('-'); return {cls: $('sCls').value.trim(), year: $('sYear').value.trim(), grade, sem}; };
  if (opts.newWb) {
    $('sSave').onclick = () => {
      const meta = readMeta(), copy = document.querySelector('input[name="newMode"]:checked')?.value === 'copy';
      const nw = blankWorkbook(meta);
      if (copy) nw.students = WB().students.map(s => blankStudent({seat: s.seat, name: s.name, gender: s.gender, no: s.no, nick: s.nick, prev: s.final, prevSpecial: s.special}));
      nw.activeId = nw.students[0]?.id || null;
      store.workbooks[nw.id] = nw; store.activeWb = nw.id; queueSave(); closeModal(); renderAll();
      toast(`已建立「${wbLabel(nw)}」`);
    };
    return;
  }
  const prov = () => $('aiProv').value;
  $('aiProv').onchange = () => { $('aiKey').value = getAiKey(prov()); $('aiModel').value = getAiModel(prov()); $('aiRemember').checked = aiRemembered(prov()); };
  $('aiGetKey').onclick = () => window.open(prov() === 'openai' ? 'https://platform.openai.com/api-keys' : 'https://aistudio.google.com/app/apikey', '_blank', 'noopener');
  $('aiDocs').onclick = () => window.open(prov() === 'openai' ? 'https://platform.openai.com/docs/models' : 'https://ai.google.dev/gemini-api/docs/models', '_blank', 'noopener');
  $('aiPreview').onclick = () => { const b = $('aiPromptBox'); b.textContent = buildAiPrompt(CUR(), WB()); b.classList.toggle('hidden'); };
  $('aiForget').onclick = () => { ['gemini', 'openai'].forEach(forgetAiKey); $('aiKey').value = ''; $('aiRemember').checked = false; toast('已清除儲存的金鑰'); };
  $('sDelWb').onclick = () => {
    const wb = WB();
    if (Object.keys(store.workbooks).length === 1 && !wb.students.length) { toast('目前沒有資料可刪除'); return; }
    if (!confirm(`確定刪除「${wbLabel(wb)}」與其中 ${wb.students.length} 位學生的評語？刪除後無法復原，建議先到「匯出」備份。`)) return;
    delete store.workbooks[wb.id];
    if (!Object.keys(store.workbooks).length) { const n = blankWorkbook(); store.workbooks[n.id] = n; }
    store.activeWb = Object.keys(store.workbooks)[0]; queueSave(); closeModal(); renderAll(); toast('已刪除');
  };
  $('sSave').onclick = () => {
    const wb = WB(), meta = readMeta();
    Object.assign(wb.meta, meta);
    setAiProvider(prov()); if (prov() !== 'none') { setAiKey(prov(), $('aiKey').value.trim(), $('aiRemember').checked); setAiModel(prov(), $('aiModel').value.trim()); }
    wb.students.forEach(s => { if (!s.finalEdited && hasContent(s)) s.final = generateComment(s, wb); if (!s.specialEdited) s.special = generateSpecial(s, wb); });
    queueSave(); closeModal(); renderAll(); toast('設定已儲存');
  };
};

// ============================================================
// AI 潤飾（Gemini／OpenAI；姓名去識別化後送出）
// ============================================================
const AI_PREFIX = 'lssh.comment.ai.';
const sessionKeys = {};
function lsGet(k) { try { return localStorage.getItem(k) || ''; } catch { return ''; } }
function lsSet(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch {} }
function getAiProvider() { const p = lsGet(AI_PREFIX + 'provider'); return ['gemini', 'openai'].includes(p) ? p : 'none'; }
function setAiProvider(p) { lsSet(AI_PREFIX + 'provider', p === 'none' ? '' : p); }
function getAiKey(p) { if (p === 'none') return ''; return sessionKeys[p] || lsGet(AI_PREFIX + p + '.key') || lsGet(`homeroom_${p}_apiKey`); }
function aiRemembered(p) { return !!lsGet(AI_PREFIX + p + '.key'); }
function setAiKey(p, key, remember) { sessionKeys[p] = key; lsSet(AI_PREFIX + p + '.key', remember ? key : ''); if (!remember) lsSet(`homeroom_${p}_apiKey`, ''); }
function forgetAiKey(p) { delete sessionKeys[p]; lsSet(AI_PREFIX + p + '.key', ''); lsSet(`homeroom_${p}_apiKey`, ''); }
function getAiModel(p) { return p === 'none' ? '' : lsGet(AI_PREFIX + p + '.model'); }
function setAiModel(p, m) { lsSet(AI_PREFIX + p + '.model', m); }

const GEMINI_FALLBACK = ['gemini-2.5-flash', 'gemini-2.5-pro', 'gemini-2.5-flash-lite'];
const OPENAI_FALLBACK = ['gpt-5.5', 'gpt-5.5-mini', 'gpt-5', 'gpt-4.1'];

function scoreModel(m) {
  let s = 0;
  if (/latest/i.test(m)) s += 1000; if (/flash|mini/i.test(m)) s += 300; if (/pro/i.test(m)) s += 200; if (/lite|nano/i.test(m)) s -= 150;
  if (/preview|exp|tts|image|audio|embedding|vision|realtime|transcribe|search|instruct/i.test(m)) s -= 2000;
  (m.match(/\d+(?:\.\d+)?/g) || []).forEach((n, i) => { s += Number(n) * (i === 0 ? 100 : 10); });
  return s;
}
async function modelList(p, key) {
  const custom = getAiModel(p);
  const fb = p === 'gemini' ? GEMINI_FALLBACK : OPENAI_FALLBACK;
  if (custom) return [custom, ...fb.filter(m => m !== custom)];
  try {
    if (p === 'gemini') {
      const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models', {headers: {'x-goog-api-key': key}});
      if (r.ok) { const d = await r.json(); const ms = (d.models || []).filter(m => (m.supportedGenerationMethods || []).includes('generateContent')).map(m => String(m.name).replace(/^models\//, '')).filter(m => /gemini/.test(m)).sort((a, b) => scoreModel(b) - scoreModel(a)); return [...new Set([...ms.slice(0, 3), ...fb])]; }
    } else {
      const r = await fetch('https://api.openai.com/v1/models', {headers: {Authorization: `Bearer ${key}`}});
      if (r.ok) { const d = await r.json(); const ms = (d.data || []).map(m => m.id).filter(id => /^gpt-/.test(id)).sort((a, b) => scoreModel(b) - scoreModel(a)); return [...new Set([...ms.slice(0, 3), ...fb])]; }
    }
  } catch {}
  return fb;
}
async function requestModel(p, key, model, prompt) {
  if (p === 'gemini') {
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
      method: 'POST', headers: {'Content-Type': 'application/json', 'x-goog-api-key': key},
      body: JSON.stringify({contents: [{role: 'user', parts: [{text: prompt}]}], generationConfig: {temperature: 0.5, topP: 0.9, maxOutputTokens: 2048}})
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error?.message || `HTTP ${r.status}`);
    const c = d.candidates?.[0];
    const text = (c?.content?.parts || []).map(x => x.text || '').join('').trim();
    if (!text) throw new Error(c?.finishReason ? `未取得文字（${c.finishReason}）` : '未取得回應');
    return text;
  }
  const r = await fetch('https://api.openai.com/v1/responses', {
    method: 'POST', headers: {'Content-Type': 'application/json', Authorization: `Bearer ${key}`},
    body: JSON.stringify({model, input: prompt, max_output_tokens: 1500})
  });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error?.message || `HTTP ${r.status}`);
  const text = d.output_text || (d.output || []).flatMap(o => o.content || []).map(x => x.text || '').join('').trim();
  if (!text) throw new Error('未取得回應');
  return text;
}
async function callAi(prompt) {
  const p = getAiProvider(); const key = getAiKey(p);
  if (p === 'none' || !key) throw new Error('NO_KEY');
  const errors = [];
  for (const m of await modelList(p, key)) {
    try {
      let text = await requestModel(p, key, m, prompt);
      if (countChars(text) < 120) text = await requestModel(p, key, m, prompt + '\n\n注意：上一版太短，請寫成完整段落並符合字數。');
      if (countChars(text) < 120) throw new Error('回覆過短');
      return {text, model: m};
    } catch (e) {
      errors.push(`${m}：${e.message}`);
      if (/api key|API_KEY|invalid.*key|401|403|permission/i.test(e.message)) break;
    }
  }
  throw new Error(errors.join('；'));
}
function cleanAiText(text, st) {
  let t = reidentify(text, st).replace(/^\s*(德行評語|評語)[:：]\s*/, '').replace(/\n+/g, '').trim();
  return t;
}
async function polishStudent(st) {
  const prompt = buildAiPrompt(st, WB());
  const {text, model} = await callAi(prompt);
  const out = cleanAiText(text, st);
  pushHistory(st);
  st.final = out; st.finalEdited = true; st.polishedBy = `${getAiProvider() === 'gemini' ? 'Gemini' : 'ChatGPT'} 潤飾`;
  st.updatedAt = new Date().toISOString();
  return model;
}
async function polishCurrent() {
  const st = CUR(); if (!st || ui.aiBusy) return;
  if (getAiProvider() === 'none' || !getAiKey(getAiProvider())) { toast('請先設定 AI 服務與金鑰'); openModal('settings'); return; }
  if (!st.final && hasContent(st)) st.final = generateComment(st, WB());
  if (!st.final) { toast('請先點選觀察項目，產生草稿後再潤飾'); return; }
  ui.aiBusy = true; renderPreview();
  try {
    const model = await polishStudent(st);
    toast(`已完成潤飾（${model}），可用「復原上一版」回到原稿`);
  } catch (e) {
    toast(e.message === 'NO_KEY' ? '請先設定 AI 金鑰' : '⚠️ AI 潤飾失敗：' + e.message.slice(0, 160));
  } finally {
    ui.aiBusy = false; queueSave();
    if (CUR() === st) renderPreview(); renderRosterItem(st);
  }
}
async function batchPolish() {
  if (ui.batchRunning) { ui.batchStop = true; return; }
  if (getAiProvider() === 'none' || !getAiKey(getAiProvider())) { toast('請先到「設定」設定 AI 服務與金鑰'); return; }
  const wb = WB();
  const list = wb.students.filter(s => !s.done && !s.polishedBy && (s.final || hasContent(s)));
  if (!list.length) { toast('沒有需要潤飾的學生（已完成或已潤飾者會略過）'); return; }
  if (!confirm(`將依序潤飾 ${list.length} 位學生（姓名會先去識別化）。可隨時按「停止」。開始？`)) return;
  ui.batchRunning = true; ui.batchStop = false;
  const btn = $('ovAi'); if (btn) btn.textContent = '停止';
  let ok = 0, fail = 0;
  for (let i = 0; i < list.length; i++) {
    if (ui.batchStop) break;
    const st = list[i];
    if ($('ovProgress')) $('ovProgress').textContent = `潤飾中 ${i + 1}/${list.length}：${st.seat} ${st.name}`;
    try { if (!st.final) st.final = generateComment(st, wb); await polishStudent(st); ok++; } catch (e) { fail++; if (e.message === 'NO_KEY' || /key|401|403/i.test(e.message)) { toast('⚠️ 金鑰無效，已停止'); break; } }
    queueSave(); if ($('ovBody')) renderOverview();
  }
  ui.batchRunning = false;
  if ($('ovAi')) $('ovAi').textContent = '全班 AI 潤飾';
  if ($('ovProgress')) $('ovProgress').textContent = `完成 ${ok} 位${fail ? `、失敗 ${fail} 位` : ''}${ui.batchStop ? '（已停止）' : ''}`;
  renderRoster(); renderPreview();
}

// ============================================================
// 啟動
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  loadStore();
  refreshAutoDrafts();
  bindEvents();
  if (!CUR() && WB().students.length) WB().activeId = WB().students[0].id;
  renderAll();
  if (countOldDrafts() && !lsGet(AI_PREFIX + 'migrateHint') && !Object.values(store.workbooks).some(w => w.students.length)) {
    lsSet(AI_PREFIX + 'migrateHint', '1');
    toast(`偵測到舊版草稿 ${countOldDrafts()} 份`, {label: '匯入', run: () => openModal('import')});
  }
});
</script>
