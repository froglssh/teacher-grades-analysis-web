<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 輔助班級事務小幫手</title>
<style>
  :root {
    --primary: #1a6fa8;
    --primary-dark: #124e78;
    --accent: #e8f4fd;
    --text: #1e2d3d;
    --text-light: #5a6a7a;
    --border: #d0e4f0;
    --bg: #f5f9fd;
    --white: #ffffff;
    --shadow: 0 4px 24px rgba(26,111,168,0.10);
    --radius: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ── */
  header {
    background: linear-gradient(135deg, #124e78 0%, #1a6fa8 60%, #2596d4 100%);
    color: white;
    padding: 18px 36px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 16px rgba(18,78,120,0.25);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-left h1 {
    font-size: 1.55rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    line-height: 1.2;
  }

  .header-left .subtitle {
    font-size: 0.82rem;
    opacity: 0.78;
    margin-top: 3px;
    letter-spacing: 0.04em;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .btn-play {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.18);
    border: 1.5px solid rgba(255,255,255,0.5);
    color: white;
    padding: 9px 20px;
    border-radius: 30px;
    cursor: pointer;
    font-size: 0.92rem;
    font-weight: 600;
    letter-spacing: 0.03em;
    transition: background 0.2s, transform 0.15s;
    backdrop-filter: blur(4px);
  }
  .btn-play:hover { background: rgba(255,255,255,0.30); transform: scale(1.04); }
  .btn-play svg { width: 18px; height: 18px; flex-shrink: 0; }

  /* ── Main Layout ── */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 28px 32px 24px;
    gap: 16px;
    max-width: 1400px;
    width: 100%;
    margin: 0 auto;
  }

  /* Progress bar */
  .progress-bar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #1a6fa8, #2596d4);
    border-radius: 2px;
    transition: width 0.35s ease;
  }

  /* ── Slide View ── */
  .slide-view { display: flex; gap: 28px; flex: 1; min-height: 0; }

  .panel-image {
    flex: 0 0 58%;
    background: var(--white);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 1.5px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    min-height: 460px;
    position: relative;
    overflow: hidden;
  }

  .panel-image img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border-radius: 6px;
    display: block;
    transition: opacity 0.25s ease;
  }

  .slide-badge {
    position: absolute;
    top: 14px;
    left: 14px;
    background: var(--primary);
    color: white;
    font-size: 0.72rem;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 20px;
    letter-spacing: 0.06em;
    opacity: 0.88;
  }

  .panel-speech {
    flex: 1;
    background: var(--white);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 1.5px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .speech-header {
    padding: 16px 22px 14px;
    border-bottom: 1.5px solid var(--accent);
    background: var(--accent);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .speech-header .icon {
    width: 32px; height: 32px;
    background: var(--primary);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .speech-header .icon svg { width: 17px; height: 17px; }

  .speech-header h2 {
    font-size: 1.0rem;
    font-weight: 700;
    color: var(--primary-dark);
  }

  .speech-body {
    flex: 1;
    overflow-y: auto;
    padding: 26px 28px;
    line-height: 2.05;
    font-size: 1.18rem;
    color: var(--text);
    letter-spacing: 0.03em;
  }
  .speech-body::-webkit-scrollbar { width: 6px; }
  .speech-body::-webkit-scrollbar-track { background: transparent; }
  .speech-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* ── Navigation ── */
  .nav-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 4px 0;
  }

  .btn-nav {
    display: flex; align-items: center; gap: 6px;
    background: var(--white);
    border: 1.5px solid var(--border);
    color: var(--primary);
    padding: 10px 22px;
    border-radius: 30px;
    cursor: pointer;
    font-size: 0.93rem;
    font-weight: 600;
    transition: all 0.18s;
    box-shadow: 0 2px 8px rgba(26,111,168,0.07);
  }
  .btn-nav:hover:not(:disabled) {
    background: var(--primary); color: white;
    border-color: var(--primary);
    box-shadow: 0 4px 14px rgba(26,111,168,0.22);
    transform: translateY(-1px);
  }
  .btn-nav:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-nav svg { width: 16px; height: 16px; }

  .slide-counter {
    font-size: 0.98rem; font-weight: 700;
    color: var(--primary-dark);
    min-width: 90px; text-align: center;
    letter-spacing: 0.05em;
  }

  /* ── Auto-play Bar (main) ── */
  .autoplay-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 10px 20px;
    background: var(--white);
    border: 1.5px solid var(--border);
    border-radius: 50px;
    box-shadow: var(--shadow);
    width: fit-content;
    margin: 0 auto;
  }

  /* Countdown ring */
  .ring-wrap {
    position: relative;
    width: 40px; height: 40px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .ring-svg { width: 40px; height: 40px; }
  .ring-count {
    position: absolute;
    font-size: 0.65rem;
    font-weight: 800;
    color: var(--primary-dark);
    line-height: 1;
    pointer-events: none;
  }

  .btn-auto {
    display: flex; align-items: center; gap: 7px;
    background: var(--primary);
    color: white;
    border: none;
    padding: 9px 18px;
    border-radius: 24px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    transition: background 0.18s, transform 0.12s, box-shadow 0.18s;
    box-shadow: 0 3px 10px rgba(26,111,168,0.25);
    white-space: nowrap;
  }
  .btn-auto:hover { background: var(--primary-dark); transform: scale(1.04); }
  .btn-auto.paused { background: #e67e22; box-shadow: 0 3px 10px rgba(230,126,34,0.30); }
  .btn-auto.paused:hover { background: #ca6f1e; }
  .btn-auto svg { width: 15px; height: 15px; flex-shrink: 0; }

  .auto-seconds-wrap {
    display: flex; align-items: center; gap: 5px;
    font-size: 0.88rem;
    font-weight: 600;
    color: var(--text-light);
    white-space: nowrap;
  }

  .auto-input {
    width: 50px;
    padding: 5px 8px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--primary-dark);
    text-align: center;
    outline: none;
    transition: border-color 0.15s;
    background: var(--bg);
  }
  .auto-input:focus { border-color: var(--primary); }
  .auto-input::-webkit-inner-spin-button { opacity: 0.5; }

  /* ── Dot Navigation ── */
  .dot-nav {
    display: flex; justify-content: center;
    gap: 6px; flex-wrap: wrap;
    padding: 4px 20px;
    max-width: 700px; margin: 0 auto;
  }
  .dot {
    width: 9px; height: 9px;
    border-radius: 50%; background: var(--border);
    cursor: pointer; transition: all 0.2s;
    border: none; padding: 0; flex-shrink: 0;
  }
  .dot:hover { background: #8bbdd9; transform: scale(1.2); }
  .dot.active {
    background: var(--primary); transform: scale(1.3);
    box-shadow: 0 0 0 3px rgba(26,111,168,0.2);
  }

  /* ── Footer ── */
  footer {
    text-align: center; padding: 14px;
    font-size: 0.78rem; color: var(--text-light);
    border-top: 1px solid var(--border);
    background: var(--white);
  }

  /* ── Fullscreen Overlay ── */
  .fullscreen-overlay {
    display: none;
    position: fixed; inset: 0;
    background: #0a0d12;
    z-index: 1000;
    flex-direction: column;
    align-items: center; justify-content: center;
  }
  .fullscreen-overlay.active { display: flex; }

  .fs-image-wrap {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    width: 100%;
    padding: 20px 80px;
    position: relative;
  }

  .fs-image-wrap img {
    max-width: 100%; max-height: 100%;
    object-fit: contain;
    border-radius: 8px;
    box-shadow: 0 8px 60px rgba(0,0,0,0.5);
    transition: opacity 0.25s;
  }

  .fs-arrow {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: rgba(255,255,255,0.10);
    border: 1.5px solid rgba(255,255,255,0.25);
    color: white; width: 54px; height: 54px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    backdrop-filter: blur(6px);
  }
  .fs-arrow:hover { background: rgba(255,255,255,0.22); transform: translateY(-50%) scale(1.08); }
  .fs-arrow:disabled { opacity: 0.2; cursor: not-allowed; }
  .fs-arrow.left { left: 18px; }
  .fs-arrow.right { right: 18px; }
  .fs-arrow svg { width: 22px; height: 22px; }

  /* Fullscreen top bar */
  .fs-bar {
    width: 100%;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: rgba(0,0,0,0.50);
    backdrop-filter: blur(8px);
  }

  .fs-title {
    color: rgba(255,255,255,0.75);
    font-size: 0.88rem; font-weight: 600;
    letter-spacing: 0.05em;
    flex-shrink: 0;
  }

  .fs-counter {
    color: white; font-size: 0.95rem; font-weight: 700;
    letter-spacing: 0.08em; flex-shrink: 0;
  }

  /* Fullscreen auto-play controls */
  .fs-auto-controls {
    display: flex; align-items: center; gap: 10px;
    flex: 1; justify-content: center;
  }

  .ring-wrap-fs {
    position: relative;
    width: 34px; height: 34px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .ring-svg-fs { width: 34px; height: 34px; }
  .ring-count-fs {
    position: absolute;
    font-size: 0.58rem; font-weight: 800;
    color: white; line-height: 1;
    pointer-events: none;
  }

  .btn-auto-fs {
    display: flex; align-items: center; gap: 6px;
    background: rgba(26,111,168,0.7);
    color: white;
    border: 1px solid rgba(37,150,212,0.6);
    padding: 7px 14px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 0.82rem; font-weight: 700;
    transition: background 0.18s, transform 0.12s;
    white-space: nowrap;
    backdrop-filter: blur(4px);
  }
  .btn-auto-fs:hover { background: rgba(26,111,168,0.9); transform: scale(1.04); }
  .btn-auto-fs.paused { background: rgba(230,126,34,0.7); border-color: rgba(230,126,34,0.6); }
  .btn-auto-fs.paused:hover { background: rgba(202,111,30,0.9); }
  .btn-auto-fs svg { width: 13px; height: 13px; flex-shrink: 0; }

  .auto-input-fs {
    width: 44px; padding: 4px 6px;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 7px;
    font-size: 0.85rem; font-weight: 700;
    color: white; text-align: center;
    background: rgba(255,255,255,0.12);
    outline: none;
    transition: border-color 0.15s;
  }
  .auto-input-fs:focus { border-color: rgba(37,150,212,0.8); }
  .auto-input-fs::-webkit-inner-spin-button { opacity: 0.4; }

  .auto-sec-label-fs {
    color: rgba(255,255,255,0.65);
    font-size: 0.8rem; font-weight: 600;
    white-space: nowrap;
  }

  .fs-close {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.3);
    color: white; padding: 7px 14px;
    border-radius: 20px; cursor: pointer;
    font-size: 0.82rem; font-weight: 600;
    display: flex; align-items: center; gap: 5px;
    transition: background 0.2s;
    flex-shrink: 0;
  }
  .fs-close:hover { background: rgba(220,50,50,0.45); border-color: rgba(220,50,50,0.7); }

  .fs-progress {
    position: absolute; bottom: 0; left: 0;
    height: 3px; background: var(--primary);
    transition: width 0.1s linear;
  }

  /* Fade animation */
  .fade-out { opacity: 0 !important; }

  /* Responsive */
  @media (max-width: 900px) {
    .slide-view { flex-direction: column; }
    .panel-image { flex: none; min-height: 260px; }
    header { padding: 14px 18px; }
    main { padding: 16px 14px; }
    .header-left h1 { font-size: 1.15rem; }
    .fs-title { display: none; }
  }
</style>
</head>
<body>

<!-- ── Header ── -->
<header>
  <div class="header-left">
    <h1>🤖 AI 輔助班級事務小幫手</h1>
    <div class="subtitle">臺北市立麗山高中　林獻升老師　導師知能研習</div>
  </div>
  <div class="header-right">
    <button class="btn-play" onclick="openFullscreen()">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      全螢幕播放
    </button>
  </div>
</header>

<!-- ── Main ── -->
<main>
  <!-- Progress -->
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill" style="width: 4.5%"></div>
  </div>

  <!-- Slide View -->
  <div class="slide-view">
    <div class="panel-image">
      <div class="slide-badge" id="slideBadge">SLIDE 01</div>
      <img id="slideImg" src="origin_image/slide_01.png" alt="簡報第 1 頁">
    </div>

    <div class="panel-speech">
      <div class="speech-header">
        <div class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
        </div>
        <h2 id="speechTitle">講者說明 ── 第 1 頁</h2>
      </div>
      <div class="speech-body" id="speechBody"></div>
    </div>
  </div>

  <!-- Navigation -->
  <div class="nav-bar">
    <button class="btn-nav" id="btnPrev" onclick="manualNavigate(-1)" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
      上一頁
    </button>
    <span class="slide-counter" id="slideCounter">1 / 22</span>
    <button class="btn-nav" id="btnNext" onclick="manualNavigate(1)">
      下一頁
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>

  <!-- Auto-play Bar (main view) -->
  <div class="autoplay-bar">
    <!-- Countdown Ring -->
    <div class="ring-wrap">
      <svg class="ring-svg" viewBox="0 0 36 36">
        <circle cx="18" cy="18" r="15" fill="none" stroke="var(--border)" stroke-width="3.5"/>
        <circle id="mainRing" cx="18" cy="18" r="15" fill="none"
          stroke="var(--primary)" stroke-width="3.5"
          stroke-dasharray="94.25" stroke-dashoffset="94.25"
          stroke-linecap="round" transform="rotate(-90 18 18)"/>
      </svg>
      <span class="ring-count" id="mainRingCount"></span>
    </div>
    <!-- Toggle button -->
    <button class="btn-auto" id="btnAutoMain" onclick="toggleAutoPlay()">
      <svg id="mainPlayIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <svg id="mainPauseIcon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      <span id="mainBtnLabel">自動播放</span>
    </button>
    <!-- Seconds input -->
    <div class="auto-seconds-wrap">
      每
      <input type="number" id="mainSeconds" value="5" min="1" max="99"
        class="auto-input" oninput="syncSeconds('main')">
      秒換頁
    </div>
  </div>

  <!-- Dot Nav -->
  <div class="dot-nav" id="dotNav"></div>
</main>

<!-- ── Footer ── -->
<footer>
  臺北市立麗山高中 林獻升老師　|　AI 輔助班級事務導師知能研習　|　本網頁圖文版權所有
</footer>

<!-- ── Fullscreen Overlay ── -->
<div class="fullscreen-overlay" id="fsOverlay">
  <!-- Top bar -->
  <div class="fs-bar">
    <span class="fs-title">🤖 AI 輔助班級事務小幫手</span>

    <!-- Fullscreen auto-play controls -->
    <div class="fs-auto-controls">
      <div class="ring-wrap-fs">
        <svg class="ring-svg-fs" viewBox="0 0 36 36">
          <circle cx="18" cy="18" r="15" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="3.5"/>
          <circle id="fsRing" cx="18" cy="18" r="15" fill="none"
            stroke="#2596d4" stroke-width="3.5"
            stroke-dasharray="94.25" stroke-dashoffset="94.25"
            stroke-linecap="round" transform="rotate(-90 18 18)"/>
        </svg>
        <span class="ring-count-fs" id="fsRingCount"></span>
      </div>
      <button class="btn-auto-fs" id="btnAutoFs" onclick="toggleAutoPlay()">
        <svg id="fsPlayIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg id="fsPauseIcon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
        <span id="fsBtnLabel">自動播放</span>
      </button>
      <input type="number" id="fsSeconds" value="5" min="1" max="99"
        class="auto-input-fs" oninput="syncSeconds('fs')">
      <span class="auto-sec-label-fs">秒換頁</span>
    </div>

    <span class="fs-counter" id="fsCounter">1 / 22</span>
    <button class="fs-close" onclick="closeFullscreen()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" width="13" height="13"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      關閉（ESC）
    </button>
  </div>

  <!-- Image area -->
  <div class="fs-image-wrap">
    <button class="fs-arrow left" id="fsArrowLeft" onclick="manualNavigate(-1)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <img id="fsImg" src="origin_image/slide_01.png" alt="簡報全螢幕">
    <button class="fs-arrow right" id="fsArrowRight" onclick="manualNavigate(1)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
    <div class="fs-progress" id="fsSlideProgress"></div>
  </div>
</div>

<script>
// ─────────────────────────────────────────
// Data
// ─────────────────────────────────────────
const TOTAL = 22;
const CIRC  = 94.25; // 2π × 15

const speeches = [
  `各位老師、導師夥伴，大家好。今天想跟大家分享的，是這段時間我們在「AI 協助導師處理班級事務」上的一些嘗試與心得。人工智慧的浪潮來得很快，而導師工作該如何因應這波數位轉型，其實是我們一直在思考的課題。我們會從「智能增強（IA）」的角度出發，介紹一系列為高中導師量身設計的實用工具，希望能幫大家把行政負擔卸下一些，把更多心力留給教育現場真正重要的事——對學生的關懷與陪伴。`,

  `最後，AI 也能為班級活動帶來一些有趣的創作可能。我們嘗試用 Nano Banana（Gemini 圖像生成）引導學生創作麗山高中藏頭詩——「樹蛙升歌夜色麗，蜓蜥華行映青山。蛺蝶偉姿飛影高，紅葉楓情秋意中」——並生成相應的中國書法水墨畫。\n\n結語，我想用這句話跟大家分享：探尋繽紛美妙的生物，編織幸福圓滿的生命。Love biology, Love yourself, Love nature life. 謝謝大家。`,

// ─────────────────────────────────────────
// State
// ─────────────────────────────────────────
let current    = 0;
let fsActive   = false;

// Auto-play
let autoPlaying  = false;
let autoSec      = 5;       // seconds per slide
let autoRemainMs = 0;       // ms remaining for this slide
let autoTimer    = null;    // setInterval handle (100ms ticks)
const TICK_MS    = 100;

// ─────────────────────────────────────────
// Init
// ─────────────────────────────────────────
function init() {
  const dotNav = document.getElementById('dotNav');
  for (let i = 0; i < TOTAL; i++) {
    const dot = document.createElement('button');
    dot.className = 'dot' + (i === 0 ? ' active' : '');
    dot.title = `第 ${i+1} 頁`;
    dot.onclick = () => { manualGoTo(i); };
    dotNav.appendChild(dot);
  }
  render();
}

function pad(n) { return String(n).padStart(2, '0'); }

// ─────────────────────────────────────────
// Render
// ─────────────────────────────────────────
function render() {
  const num = current + 1;

  // Main image
  const img = document.getElementById('slideImg');
  img.classList.add('fade-out');
  setTimeout(() => {
    img.src = `origin_image/slide_${pad(num)}.png`;
    img.alt = `簡報第 ${num} 頁`;
    img.classList.remove('fade-out');
  }, 200);

  document.getElementById('slideBadge').textContent = `SLIDE ${pad(num)}`;
  document.getElementById('speechTitle').textContent = `講者說明 ── 第 ${num} 頁`;
  document.getElementById('speechBody').textContent = speeches[current];
  document.getElementById('speechBody').scrollTop = 0;
  document.getElementById('slideCounter').textContent = `${num} / ${TOTAL}`;
  document.getElementById('progressFill').style.width = (num / TOTAL * 100) + '%';
  document.getElementById('btnPrev').disabled = current === 0;
  document.getElementById('btnNext').disabled = current === TOTAL - 1;

  document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === current));

  renderFs();
}

function renderFs() {
  const num = current + 1;
  const fsImg = document.getElementById('fsImg');
  fsImg.classList.add('fade-out');
  setTimeout(() => {
    fsImg.src = `origin_image/slide_${pad(num)}.png`;
    fsImg.alt = `簡報第 ${num} 頁`;
    fsImg.classList.remove('fade-out');
  }, 200);
  document.getElementById('fsCounter').textContent = `${num} / ${TOTAL}`;
  document.getElementById('fsSlideProgress').style.width = (num / TOTAL * 100) + '%';
  document.getElementById('fsArrowLeft').disabled  = current === 0;
  document.getElementById('fsArrowRight').disabled = current === TOTAL - 1;
}

// ─────────────────────────────────────────
// Navigation
// ─────────────────────────────────────────
function navigate(dir) {
  const next = current + dir;
  if (next < 0 || next >= TOTAL) return false;
  current = next;
  render();
  return true;
}

// Manual navigation: reset countdown timer
function manualNavigate(dir) {
  navigate(dir);
  if (autoPlaying) resetCountdown();
}

function manualGoTo(idx) {
  current = idx;
  render();
  if (autoPlaying) resetCountdown();
}

// ─────────────────────────────────────────
// Fullscreen
// ─────────────────────────────────────────
function openFullscreen() {
  fsActive = true;
  renderFs();
  document.getElementById('fsOverlay').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeFullscreen() {
  fsActive = false;
  document.getElementById('fsOverlay').classList.remove('active');
  document.body.style.overflow = '';
}

// ─────────────────────────────────────────
// Auto-play
// ─────────────────────────────────────────
function toggleAutoPlay() {
  if (autoPlaying) {
    pauseAutoPlay();
  } else {
    startAutoPlay();
  }
}

function startAutoPlay() {
  autoPlaying = true;
  resetCountdown();
  autoTimer = setInterval(tick, TICK_MS);
  updateAutoUI();
}

function pauseAutoPlay() {
  autoPlaying = false;
  clearInterval(autoTimer);
  autoTimer = null;
  updateAutoUI();
  setRingOffset(CIRC, CIRC);   // empty ring
  document.getElementById('mainRingCount').textContent = '';
  document.getElementById('fsRingCount').textContent   = '';
}

function resetCountdown() {
  autoRemainMs = autoSec * 1000;
  updateRing();
}

function tick() {
  autoRemainMs -= TICK_MS;
  updateRing();

  if (autoRemainMs <= 0) {
    const advanced = navigate(1);
    if (!advanced) {
      // Reached last slide — stop
      pauseAutoPlay();
    } else {
      resetCountdown();
    }
  }
}

function updateRing() {
  const totalMs   = autoSec * 1000;
  const fraction  = Math.max(0, autoRemainMs / totalMs);
  const offset    = CIRC * (1 - fraction);
  const secLeft   = Math.ceil(autoRemainMs / 1000);
  setRingOffset(offset, CIRC);
  document.getElementById('mainRingCount').textContent = autoPlaying ? secLeft : '';
  document.getElementById('fsRingCount').textContent   = autoPlaying ? secLeft : '';
}

function setRingOffset(offset) {
  document.getElementById('mainRing').style.strokeDashoffset = offset;
  document.getElementById('fsRing').style.strokeDashoffset   = offset;
}

function updateAutoUI() {
  const playing = autoPlaying;

  // Main
  document.getElementById('mainPlayIcon').style.display  = playing ? 'none' : '';
  document.getElementById('mainPauseIcon').style.display = playing ? ''     : 'none';
  document.getElementById('mainBtnLabel').textContent    = playing ? '暫停播放' : '自動播放';
  document.getElementById('btnAutoMain').classList.toggle('paused', playing);

  // Fullscreen
  document.getElementById('fsPlayIcon').style.display    = playing ? 'none' : '';
  document.getElementById('fsPauseIcon').style.display   = playing ? ''     : 'none';
  document.getElementById('fsBtnLabel').textContent      = playing ? '暫停' : '自動播放';
  document.getElementById('btnAutoFs').classList.toggle('paused', playing);
}

// Sync seconds between main and fullscreen inputs
function syncSeconds(source) {
  const mainInput = document.getElementById('mainSeconds');
  const fsInput   = document.getElementById('fsSeconds');

  let val = parseInt(source === 'main' ? mainInput.value : fsInput.value) || 5;
  val = Math.max(1, Math.min(99, val));

  mainInput.value = val;
  fsInput.value   = val;
  autoSec = val;

  if (autoPlaying) resetCountdown();
}

// ─────────────────────────────────────────
// Keyboard
// ─────────────────────────────────────────
document.addEventListener('keydown', (e) => {
  const tag = document.activeElement.tagName;
  if (tag === 'INPUT') return;   // don't hijack number input

  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    e.preventDefault(); manualNavigate(1);
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
    e.preventDefault(); manualNavigate(-1);
  } else if (e.key === ' ') {
    e.preventDefault();
    if (fsActive || document.getElementById('btnAutoMain')) toggleAutoPlay();
  } else if (e.key === 'Escape' && fsActive) {
    closeFullscreen();
  }
});

// ─────────────────────────────────────────
// Touch / swipe
// ─────────────────────────────────────────
let touchStartX = 0;
document.getElementById('fsOverlay').addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
}, { passive: true });
document.getElementById('fsOverlay').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 50) manualNavigate(dx < 0 ? 1 : -1);
}, { passive: true });

// ─────────────────────────────────────────
init();
</script>

</html>
